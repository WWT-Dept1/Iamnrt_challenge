<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAMNRT: The Core Value Challenge (TV Host)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=Prompt:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #241833; --ink-soft: #6B5B8A;
            --paper: #FFFFFF; --cream: #FFF9F0;
            --card-bg: rgba(255,255,255,0.97);
            --card-border: rgba(36,24,51,0.12);

            --bg-1: #FF6FA8; --bg-2: #FFD23F; --bg-3: #4FD8EB; --bg-4: #B47AFF;

            --gold: #FFD23F; --silver: #D9D9E8; --bronze: #FF9E4A;
            --color-i: #FF4D6D; --color-a: #FF9F45; --color-m: #FFD23F;
            --color-n: #52D68A; --color-r: #4FC3F7; --color-t: #B47AFF;
            --team-1: #FF9F45; --team-2: #4FC3F7; --team-3: #B47AFF; --team-4: #52D68A; --team-5: #FF4D6D;
            --coral: #FF4D6D; --cyan: #4FC3F7; --violet: #B47AFF; --lime: #52D68A;

            --wood: #FF4D6D; --wood-dark: #E22A55; --pipe: #FFD23F; --pipe-dark: #FFB300;

            --font-display: 'Baloo 2', 'Kanit', sans-serif;
            --font-body: 'Kanit', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
        button { cursor: pointer; }
        body {
            background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-4), var(--bg-3), var(--bg-1));
            background-size: 400% 400%;
            animation: bgShift 9s ease infinite;
            color: var(--ink); display: flex; flex-direction: column;
            height: 100vh; overflow: hidden; align-items: center; justify-content: center;
            position: relative;
        }
        @keyframes bgShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

        /* Floating party balloons bobbing gently */
        .glow-orb { position: fixed; width: 46px; height: 56px; border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
            z-index: 0; border: 4px solid var(--ink); animation: balloonBob ease-in-out infinite; }
        .glow-orb::before { content: ""; position: absolute; left: 50%; bottom: -24px; width: 2px; height: 24px; background: var(--ink); transform: translateX(-50%); }
        .glow-orb::after { content: ""; position: absolute; top: 11px; left: 12px; width: 9px; height: 13px; background: rgba(255,255,255,0.6); border-radius: 50%; transform: rotate(-20deg); }
        .orb-1 { background: var(--coral); top: 12%; left: 6%; animation-duration: 6.5s; }
        .orb-2 { background: var(--cyan); top: 20%; left: 84%; animation-duration: 7.5s; animation-delay: 1.2s; }
        .orb-3 { background: var(--gold); top: 62%; left: 90%; animation-duration: 6s; animation-delay: 2.4s; }
        @keyframes balloonBob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-26px) rotate(3deg); } }

        /* Rainbow confetti dust drifting behind everything */
        .sparkle-bg { position: fixed; inset: -10%; z-index: 0; pointer-events: none; opacity: 0.55;
            background-image:
                radial-gradient(circle, var(--coral) 3px, transparent 3.5px),
                radial-gradient(circle, var(--cyan) 3px, transparent 3.5px),
                radial-gradient(circle, var(--gold) 3px, transparent 3.5px),
                radial-gradient(circle, var(--violet) 3px, transparent 3.5px);
            background-size: 90px 90px, 70px 70px, 110px 110px, 130px 130px;
            background-position: 0 0, 35px 45px, 65px 15px, 20px 80px;
            animation: sparkleDrift 22s linear infinite;
        }
        @keyframes sparkleDrift { from { background-position: 0 0, 35px 45px, 65px 15px, 20px 80px; } to { background-position: 400px 400px, 435px 445px, 465px 415px, 420px 480px; } }

        /* Candy-cane striped ground with gumdrop bumps along the top */
        .jungle-ground { position: fixed; left: 0; right: 0; bottom: 0; height: 40px; z-index: 2; pointer-events: none;
            background: repeating-linear-gradient(135deg, #fff 0 22px, var(--coral) 22px 44px);
            border-top: 4px solid var(--ink);
        }
        .jungle-ground::before {
            content: ""; position: absolute; top: -14px; left: 0; right: 0; height: 16px;
            background-image:
                radial-gradient(circle at 20px 100%, var(--gold) 0 8px, transparent 9px),
                radial-gradient(circle at 60px 100%, var(--violet) 0 8px, transparent 9px);
            background-size: 80px 16px; background-repeat: repeat-x;
        }
        /* Lollipop poles standing at the edges, purely decorative */
        .warp-pipe { position: fixed; bottom: 36px; width: 12px; height: 84px; z-index: 1; pointer-events: none;
            background: repeating-linear-gradient(180deg, var(--wood) 0 9px, #fff 9px 18px);
            border: 3px solid var(--ink); border-radius: 6px;
        }
        .warp-pipe::before { content: ""; position: absolute; top: -60px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%;
            background: conic-gradient(var(--coral) 0 25%, #fff 0 50%, var(--cyan) 0 75%, #fff 0 100%);
            border: 4px solid var(--ink);
        }
        .pipe-left { left: 3%; }
        .pipe-right { right: 4%; }

        /* ---------- Carnival bunting strip: triangle pennant flags + twinkling bulbs (no sliding motion) ---------- */
        .marquee-lights {
            height: 4px; width: 100%;
            position: relative;
            background: var(--ink);
            filter: drop-shadow(0 3px 4px rgba(36,24,51,0.3));
        }
        .marquee-lights::after {
            content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 34px;
            background-image:
                radial-gradient(circle at 16px 0, var(--coral) 0 10px, transparent 11px),
                radial-gradient(circle at 48px 0, var(--gold) 0 10px, transparent 11px),
                radial-gradient(circle at 80px 0, var(--cyan) 0 10px, transparent 11px),
                radial-gradient(circle at 112px 0, var(--violet) 0 10px, transparent 11px);
            background-size: 128px 34px;
            background-repeat: repeat-x;
            animation: balloonSway 2.2s ease-in-out infinite;
        }
        @keyframes balloonSway { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

        .tv-header { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: column; z-index: 10; }
        .tv-header-row { display: flex; justify-content: space-between; align-items: center; padding: 22px 40px 12px; }
        .header-brand { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: 0.5px; color: var(--ink); background: var(--card-bg); border: 3px solid var(--gold); padding: 13px 30px; border-radius: 36px; backdrop-filter: blur(6px); box-shadow: 0 10px 24px rgba(36,24,51,0.2); animation: chipFloat 3.4s ease-in-out infinite; }
        .tv-header-right { display: flex; align-items: center; gap: 16px; }
        .player-count { font-size: 21px; color: var(--ink); font-weight: 700; transition: color 0.3s; background: var(--card-bg); padding: 13px 30px; border-radius: 36px; border: 3px solid rgba(36,24,51,0.12); backdrop-filter: blur(6px); box-shadow: 0 10px 24px rgba(36,24,51,0.2); animation: chipFloat 3.4s ease-in-out infinite 0.3s; }
        .mute-btn { font-size: 25px; width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--gold); background: var(--card-bg); backdrop-filter: blur(6px); box-shadow: 0 10px 24px rgba(36,24,51,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s, box-shadow 0.15s; animation: chipFloat 3.4s ease-in-out infinite 0.15s; }
        .mute-btn:hover { transform: translateY(-2px) scale(1.08); }
        .mute-btn:active { transform: translateY(1px) scale(0.94); }
        .mute-btn.is-muted { opacity: 0.55; border-color: rgba(36,24,51,0.2); }
        @keyframes chipFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .view { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; position: relative; z-index: 1; }
        .view.active { display: flex; animation: viewEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes viewEnter { 0%{opacity:0; transform: translateY(25px) scale(0.98);} 100%{opacity:1; transform: translateY(0) scale(1);} }

        .waiting-pulse { font-size: 28px; color: var(--ink); font-weight: 700; animation: chipFloat 3.2s ease-in-out infinite, pulseFade 1.6s ease-in-out infinite; background: var(--card-bg); border: 3px solid var(--cyan); padding: 20px 44px; border-radius: 32px; box-shadow: 0 12px 28px rgba(36,24,51,0.22); }
        @keyframes pulseFade { 0%,100%{opacity:0.75;} 50%{opacity:1;} }

        /* ===== LOBBY ===== */
        .title-logo { font-family: var(--font-display); font-size: 140px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; animation: floatLogo 3s ease-in-out infinite, logoGlow 2.4s ease-in-out infinite; color: #fff; -webkit-text-stroke: 4px var(--ink); text-shadow: 8px 8px 0 rgba(36,24,51,0.25); }
        .title-logo span { color: var(--gold); -webkit-text-stroke: 4px var(--ink); }
        @keyframes floatLogo { 0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-14px) rotate(1deg);} }
        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
            50% { filter: drop-shadow(0 0 26px rgba(255,255,255,0.75)); }
        }
        .subtitle { font-size: 30px; color: var(--ink); margin-bottom: 34px; font-weight: 700; background: var(--card-bg); border: 3px solid var(--coral); padding: 16px 42px; border-radius: 46px; backdrop-filter: blur(6px); display: inline-block; box-shadow: 0 12px 30px rgba(36,24,51,0.22); animation: chipFloat 3.6s ease-in-out infinite 0.15s; }
        .start-btn {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, var(--coral), var(--violet));
            background-size: 200% 200%;
            animation: shimmerBtn 3s ease infinite, ctaGlowPulse 1.8s ease-in-out infinite;
            color: #fff; border: 4px solid var(--ink);
            padding: 26px 84px; font-size: 40px; font-weight: 700; border-radius: 60px; cursor: pointer;
            box-shadow: 0 10px 0 var(--ink), 0 22px 40px rgba(36,24,51,0.3); margin-top: 34px; font-family: var(--font-display);
            transition: transform 0.12s, box-shadow 0.12s;
        }
        @keyframes ctaGlowPulse {
            0%, 100% { box-shadow: 0 8px 0 var(--ink), 0 18px 34px rgba(36,24,51,0.3), 0 0 0 0 rgba(255,196,0,0.5); }
            50% { box-shadow: 0 8px 0 var(--ink), 0 18px 34px rgba(36,24,51,0.3), 0 0 0 12px rgba(255,196,0,0); }
        }
        .start-btn::after {
            content: ""; position: absolute; top: 0; left: -40%; width: 30%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-20deg);
            animation: btnShine 3.4s ease-in-out infinite;
        }
        @keyframes shimmerBtn { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .start-btn:hover { transform: translateY(-2px) scale(1.03); }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink), 0 6px 14px rgba(36,24,51,0.3); }

        .lobby-teams { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 1250px; margin-top: 10px; }
        .lobby-team-col { background: var(--card-bg); border-radius: 18px; padding: 16px; width: 210px; min-height: 200px; border: 3px solid; backdrop-filter: blur(4px); box-shadow: 0 10px 24px rgba(36,24,51,0.18); }
        .lobby-team-col.t1 { border-color: var(--team-1); } .lobby-team-col.t2 { border-color: var(--team-2); }
        .lobby-team-col.t3 { border-color: var(--team-3); } .lobby-team-col.t4 { border-color: var(--team-4); } .lobby-team-col.t5 { border-color: var(--team-5); }
        .lobby-team-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: var(--ink); }
        .lobby-team-count { background: rgba(36,24,51,0.08); padding: 2px 10px; border-radius: 20px; font-size: 14px; color: var(--ink); }
        .lobby-chip-list { display: flex; flex-direction: column; gap: 6px; }
        .player-chip { background: rgba(36,24,51,0.06); color: var(--ink); padding: 7px 12px; border-radius: 10px; font-size: 15px; font-weight: 600; animation: popIn 0.4s ease-out backwards; }
        .chip-empty { font-size: 13px; color: var(--ink-soft); font-style: italic; }
        @keyframes popIn { 0%{transform:scale(0.3); opacity:0;} 70%{transform:scale(1.08);} 100%{transform:scale(1); opacity:1;} }

        /* ===== GET READY ===== */
        .get-ready-card { background: var(--card-bg); border: 4px solid var(--gold); border-radius: 42px; padding: 70px 110px; backdrop-filter: blur(8px); box-shadow: 0 24px 58px rgba(36,24,51,0.28); }
        .get-ready-num { font-family: var(--font-display); font-weight: 800; font-size: 160px; color: var(--coral); animation: zoomPunch 0.65s cubic-bezier(0.34,1.56,0.64,1); }
        .get-ready-sub { font-size: 34px; color: var(--ink); margin-top: 16px; font-weight: 700; animation: fadeSlideUp 0.5s ease-out 0.25s backwards; }
        @keyframes zoomPunch { 0%{transform:scale(0.2) rotate(-8deg); opacity:0;} 60%{transform:scale(1.25) rotate(3deg); opacity:1;} 100%{transform:scale(1) rotate(0);} }
        @keyframes fadeSlideUp { 0%{transform:translateY(14px); opacity:0;} 100%{transform:translateY(0); opacity:1;} }

        /* ===== QUESTION — big bright stage ===== */
        .q-progress-badge { font-family: var(--font-display); font-weight: 700; font-size: 27px; color: var(--ink); background: var(--gold); padding: 10px 32px; border-radius: 24px; margin-bottom: 18px; box-shadow: 0 6px 16px rgba(36,24,51,0.25); border: 2px solid var(--ink); }
        .question-stage { position: relative; width: 95%; max-width: 1280px; margin-bottom: 20px; }
        .question-image-container { position: relative; z-index: 1; width: 100%; height: 620px; border-radius: 34px; overflow: hidden; border: 6px solid #fff; box-shadow: 0 24px 60px rgba(36,24,51,0.35), 0 0 0 4px var(--cyan), 0 0 40px rgba(33,193,224,0.5); animation: stageGlow 2.4s ease-in-out infinite; }
        @keyframes stageGlow {
            0%, 100% { box-shadow: 0 24px 60px rgba(36,24,51,0.35), 0 0 0 4px var(--cyan), 0 0 30px rgba(33,193,224,0.4); }
            50% { box-shadow: 0 24px 60px rgba(36,24,51,0.35), 0 0 0 4px var(--cyan), 0 0 55px rgba(33,193,224,0.75); }
        }
        .question-image { width: 100%; height: 100%; object-fit: cover; }
        .question-text { position: relative; z-index: 1; font-size: 48px; font-weight: 600; max-width: 1260px; margin-bottom: 20px; background: var(--card-bg); color: var(--ink); border: 2px solid var(--card-border); border-radius: 26px; padding: 28px 48px; backdrop-filter: blur(6px); box-shadow: 0 10px 28px rgba(36,24,51,0.2); line-height: 1.3; }

        /* Countdown clock — bright white face, crisp colored ring, no more muddy dark */
        .countdown-clock {
            position: absolute; top: -30px; right: -30px; width: 150px; height: 150px; border-radius: 50%; z-index: 2;
            background: conic-gradient(var(--clock-color, var(--lime)) var(--pct, 100%), rgba(36,24,51,0.14) 0);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 14px 34px rgba(36,24,51,0.35), 0 0 0 6px #fff;
            transition: box-shadow 0.2s;
        }
        .countdown-clock::before {
            content: ""; position: absolute; inset: 11px; border-radius: 50%;
            background: #fff; box-shadow: inset 0 3px 8px rgba(36,24,51,0.12);
        }
        .countdown-number { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 800; font-size: 58px; color: var(--ink); }
        .countdown-clock { animation: clockTick 1s ease-in-out infinite; }
        @keyframes clockTick { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .countdown-clock.low-time { animation: clockPulse 0.5s ease-in-out infinite; }
        @keyframes clockPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
        .answered-count { position: relative; z-index: 1; margin-top: 16px; font-size: 17px; color: var(--ink); font-weight: 700; background: var(--card-bg); border: 2px solid var(--violet); padding: 9px 24px; border-radius: 24px; backdrop-filter: blur(6px); box-shadow: 0 8px 20px rgba(36,24,51,0.2); }

        /* ===== RESULT (correct answer reveal) ===== */
        .result-headline { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 26px; padding: 50px 0; }
        .result-text { position: relative; z-index: 2; font-size: 76px; font-weight: 800; margin: 0; font-family: var(--font-display); background: var(--card-bg); color: var(--ink); border: 4px solid var(--gold); padding: 24px 62px; border-radius: 32px; backdrop-filter: blur(8px); box-shadow: 0 14px 38px rgba(36,24,51,0.25); }
        .result-glow {
            position: absolute; width: 560px; height: 560px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.6), rgba(255,196,0,0.25) 45%, transparent 70%);
            filter: blur(10px); z-index: 0;
            animation: glowPulse 1.8s ease-in-out infinite;
        }
        @keyframes glowPulse { 0%,100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } }
        .result-badge-spin {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            z-index: 1; animation: badgeSpin 14s linear infinite;
        }
        @keyframes badgeSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        /* Confetti-ring medallion (replaces the old pointed star badge) — two rings of dots
           counter-spinning at different speeds for a lively kaleidoscope feel. */
        .result-badge {
            position: relative; width: 300px; height: 300px;
            animation: badgePop 0.6s cubic-bezier(0.34,1.56,0.64,1) backwards;
        }
        .result-badge::before, .result-badge::after {
            content: ""; position: absolute; top: 50%; left: 50%; border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .result-badge::before {
            width: 22px; height: 22px;
            box-shadow:
                0 -140px 0 0 var(--coral), 99px -99px 0 0 var(--gold),
                140px 0 0 0 var(--cyan), 99px 99px 0 0 var(--violet),
                0 140px 0 0 var(--lime), -99px 99px 0 0 var(--coral),
                -140px 0 0 0 var(--gold), -99px -99px 0 0 var(--cyan);
            opacity: 0.92;
        }
        .result-badge::after {
            width: 13px; height: 13px;
            box-shadow:
                0 -95px 0 0 var(--gold), 67px -67px 0 0 var(--violet),
                95px 0 0 0 var(--lime), 67px 67px 0 0 var(--coral),
                0 95px 0 0 var(--cyan), -67px 67px 0 0 var(--gold),
                -95px 0 0 0 var(--violet), -67px -67px 0 0 var(--lime);
            opacity: 0.85;
            animation: badgeSpinReverse 8s linear infinite;
        }
        @keyframes badgeSpinReverse { from { transform: translate(-50%, -50%) rotate(360deg); } to { transform: translate(-50%, -50%) rotate(0deg); } }
        @keyframes badgePop { 0% { transform: scale(0) rotate(-25deg); opacity: 0; } 70% { transform: scale(1.15) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }

        /* ===== ROUND REVEAL (per-question score popup) ===== */
        .reveal-card {
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
            width: 1120px; max-width: 96%;
            padding: 74px 76px 68px;
            background: var(--card-bg);
            border: 5px solid var(--violet);
            border-radius: 46px;
            box-shadow: 0 34px 80px rgba(36,24,51,0.34);
            backdrop-filter: blur(10px);
            animation: cardPopIn 0.55s cubic-bezier(0.34,1.56,0.64,1) backwards;
        }
        .reveal-card::before {
            content: ""; position: absolute; width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,196,0,0.22), transparent 70%);
            bottom: -180px; right: -140px; filter: blur(10px); z-index: 0;
        }
        @keyframes cardPopIn { 0% { opacity: 0; transform: scale(0.82) translateY(24px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        .reveal-title { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 700; font-size: 60px; color: var(--coral); margin-bottom: 36px; }
        .reveal-list { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 18px; width: 100%; }
        .reveal-row {
            display: flex; align-items: center; gap: 26px; justify-content: flex-start; background: rgba(36,24,51,0.05);
            color: var(--ink);
            border: 2px solid rgba(36,24,51,0.1); border-radius: 24px; padding: 24px 38px; font-size: 32px;
            animation: slideInReveal 0.5s ease-out backwards;
            transition: transform 0.15s;
        }
        .reveal-row:nth-child(1) { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,196,0,0.25); background: rgba(255,196,0,0.12); transform: scale(1.03); }
        .reveal-row:nth-child(2) { border-color: var(--silver); background: rgba(185,196,214,0.18); }
        .reveal-row:nth-child(3) { border-color: var(--bronze); background: rgba(255,140,26,0.12); }
        @keyframes slideInReveal { 0%{transform:translateX(-60px); opacity:0;} 100%{transform:translateX(0); opacity:1;} }
        .reveal-rank {
            flex-shrink: 0; width: 68px; height: 68px; border-radius: 50%; font-size: 30px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(36,24,51,0.08);
            border: 2px solid rgba(36,24,51,0.14);
        }
        .reveal-row:nth-child(1) .reveal-rank { background: #FFEEA8; border-color: var(--gold); }
        .reveal-row:nth-child(2) .reveal-rank { background: #EAEFF6; border-color: var(--silver); }
        .reveal-row:nth-child(3) .reveal-rank { background: #FFD9AE; border-color: var(--bronze); }
        .reveal-name { flex: 1; text-align: left; font-weight: 700; }
        .reveal-name small { color: var(--ink-soft); font-size: 0.65em; }
        .reveal-points { font-family: var(--font-display); font-weight: 700; color: #1BA860; font-size: 36px; }
        .reveal-empty {
            position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
            font-size: 36px; color: var(--ink); font-weight: 700; text-align: center;
            padding: 54px 40px; border-radius: 28px; width: 100%;
            background: rgba(123,63,255,0.08);
            border: 2px solid rgba(123,63,255,0.25);
            backdrop-filter: blur(12px);
            animation: emptyBounce 2.4s ease-in-out infinite;
        }
        @keyframes emptyBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .next-btn {
            position: relative; z-index: 1; overflow: hidden;
            margin-top: 46px;
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            background-size: 200% 200%;
            animation: shimmerBtn 3s ease infinite;
            color: #fff; border: 3px solid var(--ink); padding: 24px 66px; font-size: 32px; font-weight: 700;
            border-radius: 50px; cursor: pointer; font-family: var(--font-display);
            box-shadow: 0 6px 0 var(--ink), 0 14px 26px rgba(36,24,51,0.28);
            opacity: 0; transform: translateY(10px) scale(0.95); pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .next-btn::after {
            content: ""; position: absolute; top: 0; left: -40%; width: 35%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-20deg);
            animation: btnShine 3.2s ease-in-out infinite;
        }
        @keyframes btnShine { 0% { left: -40%; } 60% { left: 130%; } 100% { left: 130%; } }
        .next-btn.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; animation: shimmerBtn 3s ease infinite, nextGlowPulse 1.8s ease-in-out infinite; }
        @keyframes nextGlowPulse {
            0%, 100% { box-shadow: 0 6px 0 var(--ink), 0 14px 26px rgba(36,24,51,0.28), 0 0 0 0 rgba(33,193,224,0.5); }
            50% { box-shadow: 0 6px 0 var(--ink), 0 14px 26px rgba(36,24,51,0.28), 0 0 0 10px rgba(33,193,224,0); }
        }
        .next-btn:hover { transform: translateY(-2px) scale(1.03); }
        .next-btn:active { transform: translateY(4px) scale(0.97); box-shadow: 0 2px 0 var(--ink), 0 6px 14px rgba(36,24,51,0.28); }

        /* ===== LEADERBOARD / TEAM BREAKDOWN ===== */
        .leaderboard-title { font-size: 48px; font-weight: 700; color: var(--ink); margin-bottom: 34px; font-family: var(--font-display); background: var(--card-bg); border: 4px solid var(--gold); padding: 18px 46px; border-radius: 32px; backdrop-filter: blur(6px); display: inline-block; box-shadow: 0 12px 32px rgba(36,24,51,0.22); animation: chipFloat 3.4s ease-in-out infinite; }
        /* ===== TOP 5 INDIVIDUAL REVEAL ===== */
        .top5-list { display: flex; flex-direction: column-reverse; gap: 16px; width: 880px; max-width: 94%; }
        .top5-row {
            display: flex; align-items: center; gap: 24px; background: var(--card-bg); color: var(--ink); border: 3px solid rgba(36,24,51,0.12);
            border-radius: 24px; padding: 20px 34px; animation: zoomPunch 0.5s cubic-bezier(0.34,1.56,0.64,1) backwards;
            box-shadow: 0 10px 26px rgba(36,24,51,0.18);
        }
        .top5-row.rank-1 { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255,196,0,0.3); transform: scale(1.06); background: #FFF7DE; }
        .top5-row.rank-2 { border-color: var(--silver); background: #F1F4F9; }
        .top5-row.rank-3 { border-color: var(--bronze); background: #FFEBDA; }
        .top5-rank {
            flex-shrink: 0; width: 72px; height: 72px; border-radius: 50%; font-size: 34px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(36,24,51,0.06);
            border: 3px solid rgba(36,24,51,0.14);
        }
        .top5-row.rank-1 .top5-rank { background: #FFEEA8; border-color: var(--gold); }
        .top5-row.rank-2 .top5-rank { background: #fff; border-color: var(--silver); }
        .top5-row.rank-3 .top5-rank { background: #FFD9AE; border-color: var(--bronze); }
        .top5-name { flex: 1; text-align: left; font-size: 30px; font-weight: 700; }
        .top5-name small { color: var(--ink-soft); font-weight: 500; font-size: 0.65em; }
        .top5-score { font-family: var(--font-display); font-weight: 700; font-size: 36px; color: #1BA860; }

        /* ===== GRAND FINALE (Tournament) — proper awards podium, 1st raised in the center ===== */
        .finale-grid { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 30px; width: 94%; max-width: 1400px; }
        .finale-card {
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            width: 250px; padding: 46px 22px 30px;
            background: var(--card-bg); border: 3px solid rgba(36,24,51,0.12); border-radius: 28px;
            backdrop-filter: blur(6px); box-shadow: 0 14px 34px rgba(36,24,51,0.18);
            animation: cardRise 0.5s cubic-bezier(0.22,1,0.36,1) backwards;
            color: var(--ink);
        }
        .finale-card::before {
            content: ""; position: absolute; top: 0; left: 22px; right: 22px; height: 9px; border-radius: 0 0 12px 12px;
            background: var(--stripe-color, var(--violet));
        }
        .finale-card.is-champion {
            border-color: var(--gold); box-shadow: 0 0 40px rgba(255,196,0,0.55), 0 0 0 5px rgba(255,196,0,0.3), 0 22px 42px rgba(36,24,51,0.25);
            background: #FFF7DE; transform: scale(1.16); z-index: 2;
            animation: cardRise 0.5s cubic-bezier(0.22,1,0.36,1) backwards, championGlow 1.8s ease-in-out infinite 0.5s;
        }
        @keyframes championGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(255,196,0,0.55), 0 0 0 5px rgba(255,196,0,0.3), 0 22px 42px rgba(36,24,51,0.25); }
            50% { box-shadow: 0 0 62px rgba(255,196,0,0.85), 0 0 0 5px rgba(255,196,0,0.45), 0 22px 42px rgba(36,24,51,0.25); }
        }
        @keyframes cardRise { 0% { opacity: 0; transform: translateY(24px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .finale-rank { font-family: var(--font-display); font-weight: 700; font-size: 40px; }
        .finale-team { font-size: 26px; font-weight: 700; text-align: center; }
        .finale-score { font-family: var(--font-display); font-weight: 700; font-size: 38px; color: #1BA860; }
        .finale-card.is-champion .finale-score { color: var(--bronze); }

        /* Podium ordering: rank 1 appended first, center it and lift it above 2nd/3rd */
        .finale-card:nth-child(1) { order: 2; padding-top: 60px; }
        .finale-card:nth-child(2) { order: 1; margin-bottom: 24px; }
        .finale-card:nth-child(3) { order: 3; margin-bottom: 46px; }
        .finale-card:nth-child(n+4) { order: 4; margin-bottom: 58px; opacity: 0.92; transform: scale(0.94); }

        @keyframes shake { 0%, 100% {transform: translate(0,0);} 25% {transform: translate(-6px, 6px);} 50% {transform: translate(6px, -6px);} 75% {transform: translate(-6px, -6px);} }
        .anim-shake { animation: shake 0.3s; }
        .confetti { position: absolute; top: -20px; width: 10px; height: 14px; z-index: 100; animation: fall linear forwards; border-radius: 2px; }
        @keyframes fall {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(var(--sway, 40px), 100vh) rotate(var(--spin, 620deg)); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    

        /* =========================================================
           V2 BRIGHT FUN GAME SHOW — visual-only override
           ========================================================= */
        :root {
            --ink: #3B2856;
            --ink-soft: #77658F;
            --paper: #FFFFFF;
            --cream: #FFFDF8;
            --card-bg: rgba(255,255,255,0.90);
            --card-border: rgba(87,63,122,0.12);

            --gold: #FFD84D; --silver: #E8EDF5; --bronze: #FFB16B;
            --coral: #FF5F8F; --cyan: #43CBE8; --violet: #9B7BFF; --lime: #55D995;
            --color-i: #FF5F7E; --color-a: #FF9F43; --color-m: #FFD54A;
            --color-n: #54D98B; --color-r: #45C8EB; --color-t: #9A78FF;
        }

        body {
            background:
                radial-gradient(circle at 10% 15%, rgba(255,255,255,.98) 0 6%, transparent 18%),
                radial-gradient(circle at 90% 18%, rgba(255,255,255,.85) 0 5%, transparent 18%),
                radial-gradient(circle at 76% 80%, rgba(255,255,255,.72) 0 8%, transparent 23%),
                linear-gradient(125deg, #FFF4A8 0%, #FFD5E6 28%, #D6F5FF 57%, #E8DAFF 78%, #D8FFD9 100%);
            background-size: 120% 120%;
            animation: funBg 14s ease-in-out infinite alternate;
            color: var(--ink);
        }
        @keyframes funBg { from { background-position: 0% 30%; } to { background-position: 100% 70%; } }

        /* playful confetti: smaller, lighter, cleaner */
        .sparkle-bg { opacity: .30; filter: saturate(.9); animation-duration: 34s; }
        .glow-orb { border: 0; box-shadow: 0 12px 26px rgba(73,46,102,.14), inset -8px -10px 18px rgba(255,255,255,.24); }
        .glow-orb::before { background: rgba(85,64,111,.38); }
        .glow-orb::after { background: rgba(255,255,255,.80); }
        .orb-1 { background: linear-gradient(145deg,#ff8fb2,#ff5f8f); }
        .orb-2 { background: linear-gradient(145deg,#79e6f6,#43cbe8); }
        .orb-3 { background: linear-gradient(145deg,#ffe681,#ffd84d); }
        .warp-pipe { opacity: .40; border: 0; background: repeating-linear-gradient(180deg,#ff8fb2 0 9px,#fff 9px 18px); box-shadow: 0 8px 20px rgba(75,45,100,.12); }
        .warp-pipe::before { border: 4px solid rgba(255,255,255,.85); box-shadow: 0 8px 22px rgba(75,45,100,.14); }
        .jungle-ground { height: 28px; border-top: 0; background: linear-gradient(90deg,#ff8fb2,#ffd84d,#65dba0,#63d7ef,#a789ff,#ff8fb2); opacity:.70; }
        .jungle-ground::before { display:none; }
        .marquee-lights { height: 5px; background: linear-gradient(90deg,#ff628f,#ffd84d,#5ddc9a,#49cae8,#9b7bff,#ff628f); box-shadow: 0 4px 12px rgba(83,55,111,.12); filter:none; }
        .marquee-lights::after { opacity:.66; top:4px; filter: drop-shadow(0 4px 6px rgba(89,61,115,.08)); }

        .lobby-team-col.t3 { border-color:var(--team-3); } .lobby-team-col.t4 { border-color:var(--team-4); } .lobby-team-col.t5 { border-color:var(--team-5); }

        .start-btn, .next-btn {

            background:linear-gradient(120deg,#FF5F8F,#FF9B54 30%,#FFD84D 52%,#55D995 74%,#43CBE8 100%);

            box-shadow:0 12px 0 rgba(124,80,145,.18), 0 22px 40px rgba(91,58,119,.18);

        .get-ready-card, .reveal-card {

        }
        .get-ready-card { position:relative; overflow:hidden; }
        .get-ready-card::before { content:""; position:absolute; inset:0; background:linear-gradient(120deg,rgba(255,95,143,.12),rgba(255,216,77,.12),rgba(67,203,232,.12),rgba(155,123,255,.12)); pointer-events:none; }

        /* =========================================================
           V3 WOW MOMENTS — timed celebration, ranking & champion FX
           ========================================================= */
        .wow-burst-layer{position:fixed;inset:0;z-index:180;pointer-events:none;overflow:hidden}
        .wow-spark{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:var(--spark,#FFD84D);box-shadow:0 0 18px color-mix(in srgb,var(--spark,#FFD84D) 65%,transparent);animation:wowSpark .9s cubic-bezier(.17,.84,.44,1) forwards}
        @keyframes wowSpark{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15);opacity:0}}
        .wow-ring{position:fixed;left:50%;top:50%;z-index:175;width:120px;height:120px;border:9px solid rgba(255,255,255,.92);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);animation:wowRing .85s ease-out forwards;box-shadow:0 0 0 10px rgba(255,216,77,.30)}
        @keyframes wowRing{0%{transform:translate(-50%,-50%) scale(.25);opacity:1}100%{transform:translate(-50%,-50%) scale(5.2);opacity:0}}
        #view-result.wow-live .result-headline{animation:answerStageIn .75s cubic-bezier(.2,1.3,.3,1)}
        #view-result.wow-live .result-text{animation:answerPunch .82s cubic-bezier(.2,1.45,.25,1), answerRainbow 1.8s ease-in-out .65s infinite}
        #view-result.wow-live #correct-answer-text{display:inline-block;animation:answerLetter .75s cubic-bezier(.2,1.45,.25,1) .18s both}
        @keyframes answerStageIn{0%{opacity:0;transform:scale(.65) rotate(-3deg)}70%{transform:scale(1.06) rotate(1deg)}100%{opacity:1;transform:scale(1)}}
        @keyframes answerPunch{0%{transform:scale(.45);opacity:0}68%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
        @keyframes answerLetter{0%{transform:translateY(28px) scale(.7);opacity:0}70%{transform:translateY(-5px) scale(1.13)}100%{transform:none;opacity:1}}
        @keyframes answerRainbow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 0 18px rgba(255,216,77,.8))}}

        .reveal-row.wow-enter{opacity:0;transform:translateY(34px) scale(.90)}
        .reveal-row.wow-enter.wow-show{animation:rankCardPop .62s cubic-bezier(.2,1.35,.3,1) forwards}
        .reveal-row.wow-enter.wow-show:nth-child(1){animation-name:rankWinnerPop}
        @keyframes rankCardPop{0%{opacity:0;transform:translateY(34px) scale(.90)}70%{opacity:1;transform:translateY(-5px) scale(1.025)}100%{opacity:1;transform:none}}
        @keyframes rankWinnerPop{0%{opacity:0;transform:translateY(45px) scale(.72) rotate(-2deg)}60%{opacity:1;transform:translateY(-8px) scale(1.08) rotate(1deg)}100%{opacity:1;transform:scale(1.03)}}
        .reveal-row:first-child.wow-show::after{content:'⚡ FASTEST';position:absolute;right:24px;top:-13px;padding:5px 12px;border-radius:999px;background:linear-gradient(90deg,#FFD84D,#FF9D4D);color:#68451C;font-weight:800;font-size:13px;box-shadow:0 6px 14px rgba(255,166,55,.22);animation:badgeBounce .8s cubic-bezier(.2,1.5,.3,1)}
        .reveal-row{position:relative}
        @keyframes badgeBounce{0%{transform:scale(.2) rotate(-12deg);opacity:0}70%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1);opacity:1}}

    <script>
        // ---------- Lightweight synthesized sound effects (no external audio files) ----------
        const AudioFX = (function() {
            let ctx;
            let muted = false;
            function getCtx() {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                return ctx;
            }
            function tone(freq, duration, type, vol, delay) {
                if (muted) return;
                delay = delay || 0;
                const c = getCtx();
                const osc = c.createOscillator();
                const gain = c.createGain();
                osc.type = type; osc.frequency.value = freq;
                osc.connect(gain).connect(c.destination);
                const start = c.currentTime + delay;
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(vol, start + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.start(start); osc.stop(start + duration + 0.02);
            }

            // ---------- Background music: a light, upbeat looping arpeggio pad ----------
            let bgmGain = null, bgmTimer = null, bgmStep = 0, bgmPlaying = false;
            const bgmProgression = [
                [261.63, 329.63, 392.00, 523.25], // C major
                [220.00, 261.63, 329.63, 440.00], // A minor
                [246.94, 311.13, 369.99, 493.88], // Bdim-ish / F major color
                [174.61, 220.00, 261.63, 349.23]  // F major
            ];
            function ensureBgmGain() {
                const c = getCtx();
                if (!bgmGain) { bgmGain = c.createGain(); bgmGain.gain.value = muted ? 0 : 0.1; bgmGain.connect(c.destination); }
                return bgmGain;
            }
            function bgmNote(freq, start, dur, vol, type) {
                const c = getCtx();
                const g = ensureBgmGain();
                const osc = c.createOscillator();
                const ng = c.createGain();
                osc.type = type; osc.frequency.value = freq;
                osc.connect(ng).connect(g);
                ng.gain.setValueAtTime(0.0001, start);
                ng.gain.exponentialRampToValueAtTime(vol, start + 0.03);
                ng.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                osc.start(start); osc.stop(start + dur + 0.05);
            }
            function bgmTick() {
                const c = getCtx();
                const now = c.currentTime;
                const chord = bgmProgression[Math.floor(bgmStep / 4) % bgmProgression.length];
                const note = chord[bgmStep % chord.length];
                bgmNote(note, now, 0.42, 0.55, 'triangle');
                if (bgmStep % 8 === 0) bgmNote(note / 2, now, 0.7, 0.3, 'sine'); // gentle bass pulse
                bgmStep++;
            }
            return {
                unlock() { getCtx(); },
                click() { tone(1000, 0.05, 'sine', 0.14); },
                whoosh() { tone(200, 0.18, 'sine', 0.1); tone(500, 0.18, 'sine', 0.08, 0.05); },
                tick() { tone(880, 0.07, 'square', 0.1); },
                tickUrgent() { tone(600, 0.09, 'square', 0.18); },
                buzzer() { tone(150, 0.5, 'sawtooth', 0.22); tone(100, 0.6, 'sawtooth', 0.18, 0.05); },
                reveal() { tone(659, 0.12, 'triangle', 0.2); tone(880, 0.14, 'triangle', 0.2, 0.12); tone(1318, 0.28, 'triangle', 0.22, 0.24); },
                fanfare() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.28, 'triangle', 0.2, i * 0.14)); },
                coin() { tone(988, 0.08, 'square', 0.13); tone(1318, 0.1, 'square', 0.13, 0.06); },
                bgmStart() {
                    getCtx();
                    if (bgmPlaying) return;
                    bgmPlaying = true;
                    ensureBgmGain();
                    bgmTick();
                    bgmTimer = setInterval(bgmTick, 380);
                },
                bgmStop() {
                    bgmPlaying = false;
                    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
                },
                isMuted() { return muted; },
                setMuted(m) {
                    muted = m;
                    if (bgmGain) {
                        const c = getCtx();
                        bgmGain.gain.setTargetAtTime(muted ? 0 : 0.1, c.currentTime, 0.15);
                    }
                }
            };
        })();

        window.toggleMute = function() {
            const btn = document.getElementById('btn-mute');
            const nowMuted = !AudioFX.isMuted();
            AudioFX.setMuted(nowMuted);
            if (btn) {
                btn.textContent = nowMuted ? '🔇' : '🔊';
                btn.classList.toggle('is-muted', nowMuted);
            }
        };

        // Confetti helper (used by inline module below via window scope)
        window.createConfetti = function() {
            const colors = ['#FF4D6D', '#FFD23F', '#4FC3F7', '#B47AFF', '#52D68A', '#FF9F45'];
            for (let i = 0; i < 50; i++) {
                let c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                c.style.setProperty('--sway', (Math.random() * 200 - 100) + 'px');
                c.style.setProperty('--spin', (Math.random() * 540 + 420) + 'deg');
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                c.style.animationDuration = (Math.random() * 2 + 2.2) + 's';
                c.style.animationTimingFunction = 'cubic-bezier(0.45, 0, 0.55, 1)';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 4400);
            }
        };
    </script>

            { img: "https://wwt-dept1.github.io/Iamnrt_challenge/q10.JPEG.jpeg", text: "นายเก่ง เสนอไอเดียนำน้ำที่ผ่านการบำบัดแล้วกลับมาใช้ในระบบสุขภัณฑ์ แทนการนำไปล้างพื้นและรดน้ำต้นไม้", answer: "N" }
        ];

        // 🔗 URL ของ Google Apps Script Web App (ดู Code.gs ที่แนบมาด้วย)
        // นำ URL ที่ได้จากการ Deploy > New deployment > Web app มาใส่ตรงนี้
        const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzBwd4k4PkTXwc2l4kc2xPH-R4qR4KBjFWolLFqqOlZP1GsDH5NFztLzkxUosHSBpI/exec";

        let gameQuestions = [...masterQuestions];
        let currentQIndex = 0;
        let timerInterval;
        let liveAnswers = {};
        let allPlayers = {};
        let playerScores = {};
        let questionStartTime = 0;
        let lastTickSecond = null;
        let gameAnswerLog = [];   // เก็บคำตอบทุกข้อของทุกคนไว้ส่งขึ้นชีตตอนจบเกม
        let currentSessionId = "";

        // ===== โหมด Demo: ผู้เล่นจำลอง ตอบถูกทุกข้อ เรียงตามลำดับนี้ (เร็วสุด -> ช้าสุด) =====
        let demoMode = false;
        let realPlayers = {};
        const DEMO_TEAM = 'กลุ่มคุณนรินทร์';
        const DEMO_PLAYERS = ['Gnek', 'Narinruk96', 'ตะวันออก110', 'ต๋', 'สถาพร แดงเหลือง'];
        const DEMO_DELAYS = [1400, 2600, 3900, 5300, 6800];   // มิลลิวินาทีหลังโจทย์ขึ้น
        function buildDemoPlayers() {
            const o = {};
            DEMO_PLAYERS.forEach(n => { o[n] = { name: n, team: DEMO_TEAM }; });
            return o;
        }
        function refreshPlayerCountDisplay() {
            const display = document.getElementById('player-count-display');
            const count = Object.keys(allPlayers).length;
            if (!display) return;
            display.innerText = count > 0 ? `👥 ผู้เล่นพร้อมแล้ว: ${count} คน${demoMode ? ' (Demo)' : ''}` : `👥 รอผู้เล่นเข้าร่วม...`;
            display.style.color = count > 0 ? "#1BA860" : "var(--ink)";
        }
        window.toggleDemo = function () {
            if (!document.getElementById('view-lobby').classList.contains('active')) return;   // สลับได้เฉพาะหน้า Lobby
            demoMode = !demoMode;
            allPlayers = demoMode ? buildDemoPlayers() : realPlayers;
            liveAnswers = {};
            const btn = document.getElementById('btn-demo');
            btn.classList.toggle('on', demoMode);
            btn.innerText = demoMode ? '🎬 Demo: เปิด' : '🎬 Demo: ปิด';
            refreshPlayerCountDisplay();
            renderLobby();
        };

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function countUp(el, target, duration = 800, prefix = '', suffix = '') {
            const start = 0;
            const startTime = performance.now();
            function tick(now) {
                const progress = Math.min(1, (now - startTime) / duration);
                const eased = 1 - Math.pow(1 - progress, 3);
                const value = Math.round(start + (target - start) * eased);
                el.innerText = prefix + value.toLocaleString() + suffix;
                if (progress < 1) requestAnimationFrame(tick);
                else el.innerText = prefix + target.toLocaleString() + suffix;
            }
            requestAnimationFrame(tick);
        }

        onValue(ref(db, 'players'), (snapshot) => {
            realPlayers = snapshot.val() || {};
            if (!demoMode) allPlayers = realPlayers;
            const count = Object.keys(allPlayers).length;
            const display = document.getElementById('player-count-display');
            if (display) {
                if (count > 0) {
                    display.innerText = `👥 ผู้เล่นพร้อมแล้ว: ${count} คน${demoMode ? ' (Demo)' : ''}`;
                    display.style.color = "#1BA860";
                } else {
                    display.innerText = `👥 รอผู้เล่นเข้าร่วม...`;
                    display.style.color = "var(--ink)";
                }
            }
            renderLobby();
        });

        function getActiveTeams() {
            const set = new Set(Object.values(allPlayers).map(p => p.team));
            return Array.from(set).sort();
        }

        function renderLobby() {
            const container = document.getElementById('lobby-teams');
            if (!container) return;
            const teams = getActiveTeams();
            if (teams.length === 0) {
                container.innerHTML = `<div class="waiting-pulse">🕹️ รอทีมเข้าร่วม...</div>`;
                return;
            }
            const colorClasses = ['t1', 't2', 't3', 't4', 't5'];
            container.innerHTML = teams.map((t, idx) => {
                const members = Object.entries(allPlayers).filter(([id, p]) => p.team === t);
                const chips = members.map(([id, p], ci) => `<div class="player-chip" style="animation-delay:${ci * 0.05}s">🙋 ${p.name}</div>`).join('');
                const colorClass = colorClasses[idx % colorClasses.length];
                return `
                    <div class="lobby-team-col ${colorClass}">
                        <div class="lobby-team-name">${t} <span class="lobby-team-count">${members.length}</span></div>
                        <div class="lobby-chip-list">${chips}</div>
                    </div>
                `;
            }).join('');
        }

        onValue(ref(db, 'answers'), (snapshot) => {
            if (demoMode) return;   // โหมด Demo ไม่รับคำตอบจากมือถือจริง
            liveAnswers = snapshot.val() || {};
            const el = document.getElementById('answered-count');
            if (el && document.getElementById('view-question').classList.contains('active')) {
                el.innerText = `ตอบแล้ว ${Object.keys(liveAnswers).length}/${Object.keys(allPlayers).length} คน`;
            }
        });

        // ===== ตัวจัดการ timer กลาง: กัน timeout เก่าค้างแล้วพาไปหน้าอื่นเอง =====
        let phaseTimers = [];
        let gameRunId = 0;
        function later(fn, ms) {
            const runId = gameRunId;
            const id = setTimeout(() => { if (runId === gameRunId) fn(); }, ms);
            phaseTimers.push(id);
            return id;
        }
        function clearPhaseTimers() {
            phaseTimers.forEach(clearTimeout);
            phaseTimers = [];
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        window.startHostGame = function () {
            AudioFX.unlock();
            AudioFX.whoosh();
            AudioFX.bgmStart();
            gameRunId++;
            clearPhaseTimers();
            clearInterval(timerInterval);
            if (top5ConfettiInterval) { clearInterval(top5ConfettiInterval); top5ConfettiInterval = null; }
            gameQuestions = shuffleArray(masterQuestions);
            currentQIndex = 0;
            playerScores = {};
            gameAnswerLog = [];
            currentSessionId = 'S' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
            set(ref(db, 'answers'), null);
            set(ref(db, 'gameState'), { phase: 'lobby' });
            showGetReady();
        };

        function showGetReady() {
            switchView('view-get-ready');
            AudioFX.whoosh();
            document.getElementById('get-ready-num').innerText = `ข้อที่ ${currentQIndex + 1} / ${gameQuestions.length}`;
            later(() => { startQuestion(); }, 1500);
        }

        function startQuestion() {
            clearInterval(timerInterval);
            questionClosed = false;
            liveAnswers = {};
            const order = shuffleArray(['I', 'A', 'M', 'N', 'R', 'T']);
            set(ref(db, 'answers'), null);
            set(ref(db, 'gameState'), { phase: 'question', qIndex: currentQIndex, order: order });

            const q = gameQuestions[currentQIndex];
            const qImageContainer = document.querySelector('.question-image-container');
            if (q.img) {
                document.getElementById('q-image').src = q.img;
                qImageContainer.style.display = '';
            } else {
                document.getElementById('q-image').src = '';
                qImageContainer.style.display = 'none';
            }
            document.getElementById('q-text').innerText = q.text;
            document.getElementById('q-progress').innerText = `ข้อที่ ${currentQIndex + 1} / ${gameQuestions.length}`;
            document.getElementById('answered-count').innerText = `ตอบแล้ว 0/${Object.keys(allPlayers).length} คน`;

            const clockEl = document.getElementById('countdown-clock');
            const numberEl = document.getElementById('countdown-number');
            clockEl.style.setProperty('--pct', '100%');
            clockEl.style.setProperty('--clock-color', 'var(--lime)');
            clockEl.classList.remove('low-time');
            numberEl.innerText = '10';
            switchView('view-question');

            let timeLeft = 10000;
            questionStartTime = Date.now();
            lastTickSecond = 10;

            if (demoMode) {
                DEMO_PLAYERS.forEach((name, i) => {
                    const delay = DEMO_DELAYS[i] + Math.round((Math.random() - 0.5) * 300);
                    later(() => {
                        liveAnswers[name] = { name, team: DEMO_TEAM, answer: q.answer, time: questionStartTime + delay };
                        const el = document.getElementById('answered-count');
                        if (el) el.innerText = `ตอบแล้ว ${Object.keys(liveAnswers).length}/${Object.keys(allPlayers).length} คน`;
                    }, delay);
                });
            }

            timerInterval = setInterval(() => {
                timeLeft -= 50;
                let percent = (timeLeft / 10000) * 100;
                clockEl.style.setProperty('--pct', `${percent}%`);
                const secondsLeft = Math.max(0, Math.ceil(timeLeft / 1000));
                numberEl.innerText = secondsLeft;

                if (secondsLeft !== lastTickSecond && secondsLeft > 0) {
                    lastTickSecond = secondsLeft;
                    if (secondsLeft <= 3) AudioFX.tickUrgent(); else AudioFX.tick();
                }

                if (percent < 30) { clockEl.style.setProperty('--clock-color', 'var(--color-i)'); clockEl.classList.add('low-time'); }
                else if (percent < 60) clockEl.style.setProperty('--clock-color', 'var(--color-m)');

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuestion();
                }
            }, 50);
        }

        let questionClosed = false;
        function finishQuestion() {
            if (questionClosed) return;
            questionClosed = true;
            const qIdx = currentQIndex;
            AudioFX.buzzer();
            try {
                calculateScores();
            } catch (err) {
                console.error('calculateScores error:', err);
                const qq = gameQuestions[qIdx];
                showResult(qq ? qq.answer : 'I', []);
            }
            // watchdog: ถ้าผ่านไป 1.5 วิแล้วยังค้างหน้าคำถาม บังคับไปหน้าเฉลย
            setTimeout(() => {
                if (qIdx === currentQIndex && document.getElementById('view-question').classList.contains('active')) {
                    console.error('ค้างหน้าคำถาม — บังคับไปหน้าเฉลย');
                    const qq = gameQuestions[qIdx];
                    showResult(qq ? qq.answer : 'I', []);
                }
            }, 1500);
        }

        function calculateScores() {
            // Resolve the current question before publishing its answer to Firebase.
            const q = gameQuestions[currentQIndex];
            if (!q) {
                console.error('ไม่พบคำถามปัจจุบัน:', currentQIndex);
                return;
            }
            safe(() => set(ref(db, 'gameState'), { phase: 'result', correctAnswer: q.answer }));
            let roundScorers = [];

            for (let p in liveAnswers) {
                if (liveAnswers[p].answer === q.answer) {
                    const timeTaken = liveAnswers[p].time - questionStartTime;
                    const points = Math.max(100, Math.round(1000 - (timeTaken / 10)));

                    if (!playerScores[p]) {
                        playerScores[p] = { name: p, team: liveAnswers[p].team, score: 0 };
                    }
                    playerScores[p].score += points;
                    roundScorers.push({ name: p, team: liveAnswers[p].team, points: points });
                }
            }
            roundScorers.sort((a, b) => b.points - a.points);

            // ผู้เล่นทุกคนต้องมีในตารางคะแนน แม้ตอบผิด/ไม่ตอบ (ได้ +0)
            for (let pName in allPlayers) {
                if (!playerScores[pName]) {
                    playerScores[pName] = { name: pName, team: allPlayers[pName].team, score: 0 };
                }
            }

            // 📝 บันทึกคำตอบของ "ทุกคน" ในข้อนี้ (ถูก/ผิด/ไม่ตอบ) ไว้ส่งขึ้น Google Sheet ตอนจบเกม
            for (let pName in allPlayers) {
                const ans = liveAnswers[pName];
                const isCorrect = !!ans && ans.answer === q.answer;
                const timeTakenMs = ans ? (ans.time - questionStartTime) : null;
                const points = isCorrect ? Math.max(100, Math.round(1000 - (timeTakenMs / 10))) : 0;
                gameAnswerLog.push({
                    qIndex: currentQIndex + 1,
                    question: q.text,
                    correctAnswer: q.answer,
                    name: pName,
                    team: allPlayers[pName].team,
                    answer: ans ? ans.answer : null,
                    correct: isCorrect,
                    points: points,
                    timeTakenMs: timeTakenMs
                });
            }

            showResult(q.answer, roundScorers);
        }



        // ===== V3 WOW MOMENT HELPERS =====
        function wowBurst(intensity = 28, centerX = 50, centerY = 50) {
            const layer = document.createElement('div');
            layer.className = 'wow-burst-layer';
            const colors = ['#FF5F8F','#FF9D4D','#FFD84D','#55D995','#43CBE8','#9B7BFF'];
            for (let i = 0; i < intensity; i++) {
                const s = document.createElement('span');
                s.className = 'wow-spark';
                const angle = (Math.PI * 2 * i / intensity) + Math.random() * .24;
                const dist = 120 + Math.random() * 360;
                s.style.left = centerX + '%';
                s.style.top = centerY + '%';
                s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                s.style.setProperty('--spark', colors[i % colors.length]);
                s.style.width = (8 + Math.random()*12) + 'px';
                s.style.height = s.style.width;
                s.style.animationDelay = (Math.random() * .12) + 's';
                layer.appendChild(s);
            }
            document.body.appendChild(layer);
            const ring = document.createElement('div');
            ring.className = 'wow-ring';
            document.body.appendChild(ring);
            setTimeout(() => { layer.remove(); ring.remove(); }, 1200);
        }

        function rankAnnounce(text, duration = 1150) {
            const el = document.createElement('div');
            el.className = 'rank-announcer';
            el.innerHTML = `<div class="rank-announcer-card">${text}</div>`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), duration + 80);
        }

        function showResult(correctAnswer, roundScorers) {
            switchView('view-result');
            const view = document.getElementById('view-result');
            view.classList.remove('wow-live');
            void view.offsetWidth;
            view.classList.add('wow-live');
            const map = { 'I': 'I - สัตย์ซื่อ', 'A': 'A - คล่องตัว', 'M': 'M - มืออาชีพ', 'N': 'N - ไม่หยุดนิ่ง', 'R': 'R - วางใจได้', 'T': 'T - ร่วมมือ' };
            document.getElementById('correct-answer-text').innerText = map[correctAnswer];
            document.getElementById('correct-answer-text').style.color = `var(--color-${correctAnswer.toLowerCase()})`;

            AudioFX.reveal();
            safe(() => wowBurst(36, 50, 50));
            later(() => safe(() => window.createConfetti()), 180);
            document.body.classList.add('anim-shake');
            setTimeout(() => document.body.classList.remove('anim-shake'), 300);

            later(() => {
                view.classList.remove('wow-live');
                try { showRoundReveal(roundScorers); }
                catch (e) { console.error(e); document.getElementById('btn-next-round').classList.add('show'); }
            }, 2700);
        }

        function showRoundReveal(roundScorers) {
            switchView('view-round-reveal');
            const container = document.getElementById('round-reveal-list');
            container.innerHTML = '';
            const nextBtn = document.getElementById('btn-next-round');
            nextBtn.classList.remove('show');

            const gained = {};
            roundScorers.forEach(s => { gained[s.name] = s.points; });

            // เรียงตามคะแนนสะสม (ถ้าเท่ากันดูคะแนนรอบนี้) แสดง 8 อันดับแรกให้พอดีหน้าจอ TV
            const rows = Object.values(playerScores)
                .map(p => ({ name: p.name, team: p.team, total: p.score, gain: gained[p.name] || 0 }))
                .sort((a, b) => b.total - a.total || b.gain - a.gain)
                .slice(0, 8);

            if (rows.length === 0) {
                container.innerHTML = `<div class="reveal-empty">ยังไม่มีข้อมูลคะแนนผู้เล่น</div>`;
            } else {
                if (roundScorers.length === 0) {
                    const note = document.createElement('div');
                    note.className = 'reveal-empty';
                    note.innerText = 'รอบนี้ไม่มีใครตอบถูกเลย! 😢';
                    container.appendChild(note);
                }
                rows.forEach((s, idx) => {
                    const row = document.createElement('div');
                    row.className = 'reveal-row wow-enter';
                    row.style.animationDelay = '0s';
                    const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
                    row.innerHTML = `
                        <span class="reveal-rank">${medal}</span>
                        <span class="reveal-name">${s.name} <small>(${s.team})</small></span>
                        <span class="reveal-points" id="reveal-pts-${idx}">${s.gain > 0 ? '+0' : '+0'}</span>
                        <span class="reveal-total" style="margin-left:14px;font-weight:700;opacity:.75;white-space:nowrap" id="reveal-total-${idx}">รวม ${s.total.toLocaleString()}</span>
                    `;
                    container.appendChild(row);
                    later(() => {
                        row.classList.add('wow-show');
                        if (idx === 0) { wowBurst(18, 50, 46); }
                        countUp(document.getElementById(`reveal-pts-${idx}`), s.gain, 700, '+');
                        if (s.gain > 0) AudioFX.coin();
                    }, idx * 320 + 180);
                });
                window.createConfetti();
            }

            const revealFinishDelay = rows.length > 0 ? (rows.length - 1) * 320 + 180 + 700 + 450 : 800;
            later(() => { nextBtn.classList.add('show'); }, revealFinishDelay);
        }

        window.continueFromRoundReveal = function () {
            const btn = document.getElementById('btn-next-round');
            if (!btn.classList.contains('show')) return;   // กันกดซ้ำ/กดก่อนเวลา
            AudioFX.click();
            btn.classList.remove('show');
            clearPhaseTimers();
            currentQIndex++;
            if (currentQIndex >= gameQuestions.length) {
                set(ref(db, 'gameState'), { phase: 'lobby' });
                sendGameLogToSheet();
                showTop5();
            } else {
                showGetReady();
            }
        };

        // 📤 ส่งคะแนนสรุป + คำตอบละเอียดทุกข้อของรอบนี้ขึ้น Google Sheet
        function sendGameLogToSheet() {
            if (demoMode) { console.log('โหมด Demo — ไม่ส่งข้อมูลขึ้น Google Sheet'); return; }
            if (!SHEET_WEBAPP_URL || SHEET_WEBAPP_URL.indexOf('ใส่ID_ที่นี่') !== -1) {
                console.warn('ยังไม่ได้ตั้งค่า SHEET_WEBAPP_URL — ข้ามการบันทึกลง Google Sheet');
                return;
            }

            const rankedPlayers = Object.values(playerScores)
                .sort((a, b) => b.score - a.score)
                .map((p, idx) => ({ name: p.name, team: p.team, score: p.score, rank: idx + 1 }));

            const payload = {
                sessionId: currentSessionId,
                timestamp: new Date().toISOString(),
                players: rankedPlayers,
                answers: gameAnswerLog
            };

            // ใช้ text/plain + no-cors เพื่อเลี่ยงปัญหา CORS preflight กับ Apps Script Web App
            fetch(SHEET_WEBAPP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).catch(err => console.error('ส่งข้อมูลขึ้น Google Sheet ไม่สำเร็จ:', err));
        }

        let top5ConfettiInterval = null;

        function showTop5() {
            switchView('view-top5');
            const container = document.getElementById('top5-list');
            container.innerHTML = '';
            const nextBtn = document.getElementById('btn-next-top5');
            nextBtn.classList.remove('show');
            if (top5ConfettiInterval) { clearInterval(top5ConfettiInterval); top5ConfettiInterval = null; }

            // ค้างหน้านี้ไว้ 60 วินาที ก่อนให้ปุ่มไป Tournament Champion ปรากฏ
            later(() => { nextBtn.classList.add('show'); }, 60000);

            let sorted = Object.values(playerScores).sort((a, b) => b.score - a.score).slice(0, 5);
            if (sorted.length === 0) {
                container.innerHTML = `<div class="reveal-empty">ไม่มีข้อมูลคะแนนผู้เล่น</div>`;
                return;
            }

            let revealOrder = [...sorted].reverse();
            revealOrder.forEach((p, i) => {
                later(() => {
                    const rank = sorted.length - i;
                    const row = document.createElement('div');
                    row.className = `top5-row rank-${rank} wow-rank-in`;
                    const medal = rank === 1 ? '👑' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
                    row.innerHTML = `
                        <span class="top5-rank">${medal}</span>
                        <span class="top5-name">${p.name}<br><small>${p.team}</small></span>
                        <span class="top5-score" id="top5-score-${rank}">0 pts</span>
                    `;
                    container.appendChild(row);
                    rankAnnounce(rank === 1 ? '👑 อันดับ 1!' : `อันดับ ${rank}`, rank === 1 ? 1450 : 900);
                    setTimeout(() => row.classList.add('wow-show'), rank === 1 ? 380 : 180);
                    AudioFX.reveal();
                    setTimeout(() => {
                        countUp(document.getElementById(`top5-score-${rank}`), p.score, 900, '', ' pts');
                    }, 200);
                    if (rank === 1) {
                        setTimeout(() => { AudioFX.fanfare(); wowBurst(48, 50, 48); window.createConfetti(); }, 500);
                        top5ConfettiInterval = setInterval(window.createConfetti, 1200);
                    } else {
                        window.createConfetti();
                    }
                }, i * 2200);
            });
        }

        window.continueFromTop5 = function () {
            if (!document.getElementById('btn-next-top5').classList.contains('show')) return;
            AudioFX.click();
            clearPhaseTimers();
            document.getElementById('btn-next-top5').classList.remove('show');
            if (top5ConfettiInterval) { clearInterval(top5ConfettiInterval); top5ConfettiInterval = null; }
            showGrandFinale();
        };

        function showGrandFinale() {
            switchView('view-grand-finale');
            AudioFX.fanfare();

            let teamTotals = {};
            getActiveTeams().forEach(t => { teamTotals[t] = 0; });
            Object.values(playerScores).forEach(p => { if (p.team && teamTotals[p.team] === undefined) teamTotals[p.team] = 0; });
            for (let pId in playerScores) {
                let t = playerScores[pId].team;
                if (teamTotals[t] !== undefined) {
                    teamTotals[t] += playerScores[pId].score;
                }
            }

            let sortedTeams = Object.keys(teamTotals).map(t => ({ name: t, score: teamTotals[t] }));
            sortedTeams.sort((a, b) => b.score - a.score);

            const teamOrder = getActiveTeams();
            const stripeColors = ['var(--team-1)', 'var(--team-2)', 'var(--team-3)', 'var(--team-4)', 'var(--team-5)'];

            const chart = document.getElementById('grand-chart');
            chart.innerHTML = '';

            const medal = (rank) => rank === 1 ? '👑' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;

            sortedTeams.forEach((t, index) => {
                const rank = index + 1;
                const card = document.createElement('div');
                card.className = `finale-card ${index === 0 ? 'is-champion wow-champion' : 'wow-runner'}`;
                card.style.animationDelay = `${index * 0.12}s`;
                const colorIdx = teamOrder.indexOf(t.name);
                card.style.setProperty('--stripe-color', stripeColors[colorIdx >= 0 ? colorIdx % stripeColors.length : index % stripeColors.length]);

                const rankText = document.createElement('div');
                rankText.className = 'finale-rank';
                rankText.innerText = medal(rank);

                const nameText = document.createElement('div');
                nameText.className = 'finale-team';
                nameText.innerText = t.name;

                const scoreText = document.createElement('div');
                scoreText.className = 'finale-score';
                scoreText.innerText = '0 pts';

                if (index === 0) {
                    const crown = document.createElement('div'); crown.className = 'champion-crown'; crown.textContent = '👑';
                    const ribbon = document.createElement('div'); ribbon.className = 'champion-ribbon'; ribbon.textContent = 'CHAMPION!';
                    card.appendChild(crown); card.appendChild(ribbon);
                }
                card.appendChild(rankText);
                card.appendChild(nameText);
                card.appendChild(scoreText);
                chart.appendChild(card);

                setTimeout(() => {
                    scoreText.classList.add('wow-score');
                    countUp(scoreText, t.score, 1100, '', ' pts');
                    if (index === 0) {
                        rankAnnounce('🏆 ผู้ชนะประจำเกม!', 1700);
                        setTimeout(() => { wowBurst(64, 50, 43); window.createConfetti(); AudioFX.fanfare(); }, 520);
                        setTimeout(() => window.createConfetti(), 1300);
                        setTimeout(() => window.createConfetti(), 2200);
                    }
                }, index * 150 + 300);
            });
        }
    </script>
</body>
</html>
