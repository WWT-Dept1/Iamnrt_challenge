<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controller - IAMNRT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=Prompt:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #241833; --ink-soft: #6B5B8A;
            --paper: #FFFFFF; --cream: #FFF9F0;
            --card-bg: rgba(255,255,255,0.97); --card-border: rgba(36,24,51,0.12);

            --bg-1: #FF6FA8; --bg-2: #FFD23F; --bg-3: #4FD8EB; --bg-4: #B47AFF;

            --gold: #FFD23F;
            --coral: #FF4D6D;
            --cyan: #4FC3F7;
            --violet: #B47AFF;
            --lime: #52D68A;
            --amber: #FF9F45;

            --color-i: #FF4D6D; --color-a: #FF9F45; --color-m: #FFD23F;
            --color-n: #52D68A; --color-r: #4FC3F7; --color-t: #B47AFF;

            --wood: #FF4D6D; --wood-dark: #E22A55; --pipe: #FFD23F; --pipe-dark: #FFB300;

            --font-display: 'Baloo 2', 'Kanit', sans-serif;
            --font-body: 'Kanit', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
        button, select { cursor: pointer; }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-4), var(--bg-3), var(--bg-1));
            background-size: 400% 400%;
            animation: bgShift 9s ease infinite;
            color: var(--ink);
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            justify-content: center; align-items: center;
            position: relative;
        }
        @keyframes bgShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

        /* ---------- Soft glow orbs + drifting sparkle dust (signature backdrop) ---------- */
        .glow-orb { position: fixed; width: 30px; height: 38px; border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%; z-index: 0; pointer-events: none; border: 3px solid var(--ink); animation: balloonBob ease-in-out infinite; }
        .glow-orb::before { content: ""; position: absolute; left: 50%; bottom: -16px; width: 2px; height: 16px; background: var(--ink); transform: translateX(-50%); }
        .glow-orb::after { content: ""; position: absolute; top: 7px; left: 8px; width: 6px; height: 9px; background: rgba(255,255,255,0.6); border-radius: 50%; transform: rotate(-20deg); }
        .orb-1 { background: var(--coral); top: 5%; left: 10%; animation-duration: 6s; }
        .orb-2 { background: var(--cyan); top: 9%; left: 78%; animation-duration: 7s; animation-delay: 1s; }
        @keyframes balloonBob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-16px) rotate(3deg); } }

        .jungle-ground { position: fixed; left: 0; right: 0; bottom: 0; height: 22px; z-index: 0; pointer-events: none;
            background: repeating-linear-gradient(135deg, #fff 0 14px, var(--coral) 14px 28px);
            border-top: 3px solid var(--ink);
        }
        .jungle-ground::before {
            content: ""; position: absolute; top: -10px; left: 0; right: 0; height: 12px;
            background-image:
                radial-gradient(circle at 12px 100%, var(--gold) 0 6px, transparent 7px),
                radial-gradient(circle at 36px 100%, var(--violet) 0 6px, transparent 7px);
            background-size: 48px 12px; background-repeat: repeat-x;
        }

        .spotlight-bg { position: fixed; inset: -10%; z-index: 0; pointer-events: none; opacity: 0.5;
            background-image:
                radial-gradient(circle, var(--coral) 3px, transparent 3.5px),
                radial-gradient(circle, var(--cyan) 3px, transparent 3.5px),
                radial-gradient(circle, var(--gold) 3px, transparent 3.5px);
            background-size: 80px 80px, 60px 60px, 100px 100px;
            background-position: 0 0, 30px 40px, 55px 12px;
            animation: sparkleDrift 22s linear infinite;
        }
        @keyframes sparkleDrift { from { background-position: 0 0, 30px 40px, 55px 12px; } to { background-position: 380px 380px, 410px 420px, 435px 392px; } }

        .drift-particle { position: absolute; bottom: -30px; border-radius: 50%; opacity: 0.75; animation: driftUp linear infinite; z-index: 0; box-shadow: 0 0 8px rgba(255,255,255,0.5); }
        @keyframes driftUp { 0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.8; } 100% { transform: translateY(-112vh) scale(0.4) rotate(200deg); opacity: 0; } }

        /* ---------- Balloon-string bunting (party-string decoration) ---------- */
        .marquee-lights {
            height: 4px; width: 100%;
            position: relative;
            background: var(--ink);
            filter: drop-shadow(0 3px 4px rgba(36,24,51,0.3));
        }
        .marquee-lights::after {
            content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 26px;
            background-image:
                radial-gradient(circle at 13px 0, var(--coral) 0 8px, transparent 9px),
                radial-gradient(circle at 39px 0, var(--gold) 0 8px, transparent 9px),
                radial-gradient(circle at 65px 0, var(--cyan) 0 8px, transparent 9px),
                radial-gradient(circle at 91px 0, var(--violet) 0 8px, transparent 9px);
            background-size: 104px 26px;
            background-repeat: repeat-x;
            animation: balloonSway 2.2s ease-in-out infinite;
        }
        @keyframes balloonSway { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

        /* ================= SETUP SCREEN ================= */
        #setup-screen {
            display: flex; flex-direction: column;
            width: 90%; max-width: 400px;
            background: var(--card-bg);
            border-radius: 30px;
            text-align: center;
            border: 3px solid var(--gold);
            box-shadow: 0 25px 70px rgba(36,24,51,0.28), 0 0 0 1px rgba(255,255,255,0.5) inset;
            position: relative; z-index: 1;
            overflow: visible;
            backdrop-filter: blur(8px);
            animation: cardRise 0.65s cubic-bezier(0.22,1,0.36,1);
        }
        .tent-valance {
            position: absolute; top: -22px; left: -3px; right: -3px; height: 30px;
            background-image: repeating-linear-gradient(90deg, var(--coral) 0 20px, #fff 20px 40px);
            -webkit-mask-image: radial-gradient(circle 12px at 10px 0, transparent 11px, #000 12px);
            mask-image: radial-gradient(circle 12px at 10px 0, transparent 11px, #000 12px);
            -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
            -webkit-mask-size: 20px 30px; mask-size: 20px 30px;
            border-radius: 30px 30px 0 0;
            filter: drop-shadow(0 4px 6px rgba(36,24,51,0.25));
        }
        @keyframes cardRise { 0% { transform: translateY(40px) scale(0.94); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }

        .setup-inner { padding: 34px 30px 34px; }

        .stage-badge {
            display: inline-block; font-family: var(--font-body); font-size: 13px; font-weight: 700;
            letter-spacing: 2px; color: var(--ink); background: rgba(255,196,0,0.14);
            border: 2px solid var(--gold); padding: 6px 18px; border-radius: 20px;
            margin-bottom: 18px; text-transform: uppercase;
            animation: chipFloat 3.4s ease-in-out infinite;
        }
        @keyframes chipFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .marquee-title {
            font-family: var(--font-display);
            font-size: 46px; font-weight: 800;
            letter-spacing: 3px;
            display: flex; justify-content: center; gap: 3px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .marquee-title span {
            display: inline-block;
            -webkit-text-stroke: 2px var(--ink);
            animation: letterFloat 2.2s ease-in-out infinite, letterGlow 2.2s ease-in-out infinite;
            text-shadow: 3px 3px 0 rgba(36,24,51,0.12);
        }
        @keyframes letterGlow {
            0%, 100% { filter: drop-shadow(0 0 0 currentColor); }
            50% { filter: drop-shadow(0 0 10px currentColor); }
        }
        .marquee-title span:nth-child(1) { color: var(--color-i); animation-delay: 0s; }
        .marquee-title span:nth-child(2) { color: var(--color-a); animation-delay: 0.12s; }
        .marquee-title span:nth-child(3) { color: var(--color-m); animation-delay: 0.24s; }
        .marquee-title span:nth-child(4) { color: var(--color-n); animation-delay: 0.36s; }
        .marquee-title span:nth-child(5) { color: var(--color-r); animation-delay: 0.48s; }
        .marquee-title span:nth-child(6) { color: var(--color-t); animation-delay: 0.6s; }
        @keyframes letterFloat { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }

        .setup-sub {
            font-size: 15px; color: var(--ink-soft); margin-bottom: 28px; font-weight: 600; letter-spacing: 0.3px;
        }

        input, select {
            width: 100%;
            padding: 17px; margin-bottom: 14px;
            border-radius: 16px; border: 2px solid var(--card-border);
            font-size: 17px; font-family: var(--font-body); font-weight: 500;
            text-align: center; color: var(--ink);
            background: #fff;
            outline: none;
            transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
        }
        input::placeholder { color: #B0A6CC; }
        input:focus, select:focus { border-color: var(--cyan); transform: scale(1.02); box-shadow: 0 0 0 4px rgba(33,193,224,0.18); }
        select { cursor: pointer; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--violet) 50%), linear-gradient(135deg, var(--violet) 50%, transparent 50%); background-position: calc(100% - 22px) center, calc(100% - 16px) center; background-size: 6px 6px; background-repeat: no-repeat; text-align: left; padding-left: 20px; }

        .start-btn {
            position: relative; overflow: hidden;
            background: radial-gradient(circle 4px at 12px 12px, rgba(0,0,0,0.35) 0 4px, transparent 4.5px),
                radial-gradient(circle 4px at calc(100% - 12px) 12px, rgba(0,0,0,0.35) 0 4px, transparent 4.5px),
                radial-gradient(circle 4px at 12px calc(100% - 12px), rgba(0,0,0,0.35) 0 4px, transparent 4.5px),
                radial-gradient(circle 4px at calc(100% - 12px) calc(100% - 12px), rgba(0,0,0,0.35) 0 4px, transparent 4.5px),
                linear-gradient(135deg, var(--coral), var(--violet));
            background-size: auto, auto, auto, auto, 200% 200%;
            color: #fff; border: 3px solid var(--ink);
            padding: 18px; font-size: 21px; font-weight: 700;
            font-family: var(--font-display);
            letter-spacing: 1px;
            border-radius: 18px; cursor: pointer;
            box-shadow: 0 8px 0 var(--ink), 0 16px 32px rgba(36,24,51,0.3), 0 0 0 0 rgba(255,196,0,0.5);
            animation: shimmer 3s ease infinite, btnGlowPulse 1.8s ease-in-out infinite;
            transition: transform 0.12s, box-shadow 0.12s;
            margin-top: 4px;
        }
        @keyframes btnGlowPulse {
            0%, 100% { box-shadow: 0 8px 0 var(--ink), 0 16px 32px rgba(36,24,51,0.3), 0 0 0 0 rgba(255,196,0,0.45); }
            50% { box-shadow: 0 8px 0 var(--ink), 0 16px 32px rgba(36,24,51,0.3), 0 0 0 10px rgba(255,196,0,0); }
        }
        .start-btn::after {
            content: ""; position: absolute; top: 0; left: -45%; width: 32%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-20deg);
            animation: btnShine 3.2s ease-in-out infinite;
        }
        @keyframes btnShine { 0% { left: -45%; } 55% { left: 130%; } 100% { left: 130%; } }
        .start-btn:hover { transform: translateY(-2px) scale(1.02); }
        .start-btn:active { transform: translateY(6px) scale(1); box-shadow: 0 2px 0 var(--ink), 0 6px 14px rgba(36,24,51,0.3); }
        @keyframes shimmer { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        /* ================= MOBILE CONTROLLER ================= */
        #mobile-controller {
            display: none; flex-direction: column;
            width: 100%; height: 100%;
            padding: 0; position: relative; z-index: 1;
        }

        .mute-btn {
            position: absolute; top: 14px; right: 14px; z-index: 5;
            font-size: 17px; width: 38px; height: 38px; border-radius: 50%;
            border: 2px solid var(--gold); background: var(--card-bg); backdrop-filter: blur(6px);
            box-shadow: 0 6px 16px rgba(36,24,51,0.2); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s;
        }
        .mute-btn:active { transform: scale(0.9); }
        .mute-btn.is-muted { opacity: 0.55; }

        .mobile-header {
            text-align: center;
            font-family: var(--font-display);
            font-size: 17px; font-weight: 700;
            color: var(--ink);
            letter-spacing: 0.5px;
            background: var(--card-bg); border: 2px solid var(--gold);
            display: block; width: fit-content; margin: 14px auto 8px; padding: 10px 26px; border-radius: 22px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(36,24,51,0.2);
            animation: chipFloat 3.4s ease-in-out infinite;
        }

        .controller-hint {
            text-align: center; font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600;
            background: var(--card-bg); width: fit-content; margin: 0 auto 4px; padding: 6px 18px; border-radius: 16px;
        }

        .grid-buttons {
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
            gap: 14px; flex: 1; padding: 10px 16px 22px;
        }

        .btn-choice {
            position: relative;
            border: 3px solid var(--ink);
            border-radius: 24px;
            font-family: var(--font-display);
            font-size: 48px; font-weight: 800;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 8px 0 var(--ink), 0 14px 24px rgba(36,24,51,0.28), inset 0 3px 12px rgba(255,255,255,0.32);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.12s, box-shadow 0.12s, filter 0.2s;
            animation: btnPopIn 0.55s cubic-bezier(0.34,1.56,0.64,1) backwards;
            overflow: hidden;
        }
        .btn-choice::after {
            content: ""; position: absolute; top: -60%; left: -20%;
            width: 60%; height: 220%;
            background: rgba(255,255,255,0.3);
            transform: rotate(20deg);
            animation: shine 2.8s ease-in-out infinite;
        }
        @keyframes shine { 0% { left: -40%; } 50% { left: 130%; } 100% { left: 130%; } }
        @keyframes btnPopIn { 0% { transform: scale(0.3) rotate(-8deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

        .btn-choice:nth-child(1) { animation-delay: 0.05s; }
        .btn-choice:nth-child(2) { animation-delay: 0.1s; }
        .btn-choice:nth-child(3) { animation-delay: 0.15s; }
        .btn-choice:nth-child(4) { animation-delay: 0.2s; }
        .btn-choice:nth-child(5) { animation-delay: 0.25s; }
        .btn-choice:nth-child(6) { animation-delay: 0.3s; }

        .btn-choice:not(:disabled) { animation: btnPopIn 0.55s cubic-bezier(0.34,1.56,0.64,1) backwards, choiceGlow 1.6s ease-in-out infinite; }
        @keyframes choiceGlow {
            0%, 100% { box-shadow: 0 8px 0 var(--ink), 0 14px 24px rgba(36,24,51,0.28), inset 0 3px 12px rgba(255,255,255,0.32), 0 0 0 0 rgba(255,255,255,0.5); }
            50% { box-shadow: 0 8px 0 var(--ink), 0 14px 24px rgba(36,24,51,0.28), inset 0 3px 12px rgba(255,255,255,0.32), 0 0 0 6px rgba(255,255,255,0); }
        }
        .btn-choice:not(:disabled):hover { transform: translateY(-3px) scale(1.03); }
        .btn-choice:not(:disabled):active { transform: translateY(6px) scale(0.96); box-shadow: 0 2px 0 var(--ink), 0 5px 12px rgba(36,24,51,0.28); }

        .btn-choice:disabled { cursor: not-allowed; filter: grayscale(55%) brightness(0.85); box-shadow: 0 4px 0 var(--ink), 0 6px 14px rgba(36,24,51,0.22); transform: translateY(4px); animation: none; opacity: 0.75; }
        .btn-choice:disabled::after { display: none; }

        .btn-choice span.label { font-family: var(--font-body); font-size: 14px; font-weight: 600; margin-top: 6px; text-shadow: 0 1px 3px rgba(36,24,51,0.35); }

        .btn-i { background: linear-gradient(145deg, #FF7A88, var(--color-i)); }
        .btn-a { background: linear-gradient(145deg, #FFB067, var(--color-a)); }
        .btn-m { background: linear-gradient(145deg, #FFDD67, var(--color-m)); }
        .btn-n { background: linear-gradient(145deg, #6FE8A0, var(--color-n)); }
        .btn-r { background: linear-gradient(145deg, #6FE0EE, var(--color-r)); }
        .btn-t { background: linear-gradient(145deg, #B499FF, var(--color-t)); }

        .lock-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 246, 233, 0.94);
            display: flex; align-items: center; justify-content: center;
            font-size: 21px; color: var(--ink); font-family: var(--font-display); font-weight: 700;
            z-index: 20; flex-direction: column; gap: 18px;
            text-align: center; padding: 30px;
            opacity: 0; transform: scale(0.96); pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .lock-overlay.active { opacity: 1; transform: scale(1); pointer-events: auto; }
        .lock-overlay .spinner-lights {
            width: 68px; height: 68px; border-radius: 50%;
            background: conic-gradient(var(--coral), var(--gold), var(--cyan), var(--violet), var(--lime), var(--coral));
            animation: spin 1.3s linear infinite;
            box-shadow: 0 0 0 6px #fff, 0 8px 24px rgba(36,24,51,0.25);
            position: relative;
        }
        .lock-overlay .spinner-lights::before {
            content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--cream);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ================= ANSWER REVEAL (per-question result on the player's own phone) ================= */
        .reveal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
            z-index: 25; text-align: center; padding: 30px;
            opacity: 0; transform: scale(0.9); pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .reveal-overlay.active { opacity: 1; transform: scale(1); pointer-events: auto; animation: revealPop 0.5s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes revealPop { 0% { transform: scale(0.7); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
        .reveal-overlay.is-correct { background: rgba(220, 255, 233, 0.97); }
        .reveal-overlay.is-wrong { background: rgba(255, 231, 231, 0.97); }
        .reveal-overlay.is-none { background: rgba(255, 246, 233, 0.97); }
        .reveal-icon { font-size: 84px; line-height: 1; animation: iconBounce 0.9s ease-in-out infinite; }
        @keyframes iconBounce { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(-4deg); } }
        .reveal-status { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--ink); }
        .reveal-overlay.is-correct .reveal-status { color: #1BA860; }
        .reveal-overlay.is-wrong .reveal-status { color: var(--coral); }
        .reveal-correct-answer {
            font-size: 17px; font-weight: 700; color: var(--ink);
            background: #fff; border: 2px solid var(--card-border); border-radius: 18px;
            padding: 14px 26px; box-shadow: 0 8px 20px rgba(36,24,51,0.18);
        }
        .reveal-correct-answer span { font-family: var(--font-display); font-weight: 800; font-size: 20px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    

        /* =========================================================
           V2 BRIGHT FUN PLAYER CONTROLLER — visual-only override
           ========================================================= */
        :root {
            --ink:#432C5D; --ink-soft:#79678E; --paper:#fff; --cream:#FFFDF8;
            --card-bg:rgba(255,255,255,.90); --card-border:rgba(87,63,122,.11);
            --bg-1:#FFF3A8; --bg-2:#FFD8E8; --bg-3:#D1F5FF; --bg-4:#E7DBFF;
            --gold:#FFD84D; --coral:#FF5F8F; --cyan:#43CBE8; --violet:#9B7BFF; --lime:#55D995; --amber:#FF9D4D;
            --color-i:#FF5F7E; --color-a:#FF9D45; --color-m:#FFD54A; --color-n:#54D98B; --color-r:#45C8EB; --color-t:#9A78FF;
        }
        body {
            background:
                radial-gradient(circle at 12% 12%, rgba(255,255,255,.92) 0 5%, transparent 20%),
                radial-gradient(circle at 90% 28%, rgba(255,255,255,.76) 0 6%, transparent 21%),
                linear-gradient(145deg,#FFF2A8 0%,#FFD7E8 30%,#D2F6FF 62%,#E8DAFF 100%);
            background-size:130% 130%; animation:funBg 13s ease-in-out infinite alternate;
        }
        @keyframes funBg { from{background-position:0% 20%} to{background-position:100% 80%} }
        .spotlight-bg{opacity:.22;animation-duration:36s}.glow-orb{border:0;box-shadow:0 9px 22px rgba(70,47,95,.12),inset -5px -7px 12px rgba(255,255,255,.22)}
        .glow-orb::before{background:rgba(73,50,97,.30)}.orb-1{background:linear-gradient(145deg,#ff91b2,#ff5f8f)}.orb-2{background:linear-gradient(145deg,#83e8f7,#43cbe8)}
        .jungle-ground{height:18px;border:0;background:linear-gradient(90deg,#ff6b97,#ffd84d,#59db98,#4bcee9,#9b7bff,#ff6b97);opacity:.72}.jungle-ground::before{display:none}
        .marquee-lights{height:5px;background:linear-gradient(90deg,#ff628f,#ffd84d,#55d995,#43cbe8,#9b7bff,#ff628f);filter:none;box-shadow:0 4px 12px rgba(82,54,109,.10)}
        .marquee-lights::after{opacity:.58}

        #setup-screen {
            width:min(92%,430px); max-width:430px; border:0; border-radius:30px;
            background:rgba(255,255,255,.88); box-shadow:0 24px 60px rgba(73,49,99,.17),0 0 0 7px rgba(255,255,255,.20);

<body>

    <script>
        // Decorative floating particles (purely visual, no game logic)
        (function() {
            const colors = ['#FF4D6D', '#FFD23F', '#4FC3F7', '#B47AFF', '#52D68A', '#FF9F45'];
            const container = document.getElementById('confetti-bg');
            for (let i = 0; i < 18; i++) {
                const el = document.createElement('span');
                el.className = 'drift-particle';
                const size = 5 + Math.random() * 7;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.animationDuration = (7 + Math.random() * 9) + 's';
                el.style.animationDelay = (Math.random() * 8) + 's';
                container.appendChild(el);
            }
        })();

        // ---------- Lightweight synthesized sound effects (no external audio files) ----------
        const AudioFX = (function() {
            let ctx;
            let muted = false;
            function getCtx() {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                return ctx;
            }
            function tone(freq, duration, type, vol, delay) {
                if (muted) return;
                delay = delay || 0;
                const c = getCtx();
                const osc = c.createOscillator();
                const gain = c.createGain();
                osc.type = type; osc.frequency.value = freq;
                osc.connect(gain).connect(c.destination);
                const start = c.currentTime + delay;
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(vol, start + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.start(start); osc.stop(start + duration + 0.02);
            }

            // ---------- Background music: soft looping arpeggio, quiet on a phone speaker ----------
            let bgmGain = null, bgmTimer = null, bgmStep = 0, bgmPlaying = false;
            const bgmProgression = [
                [261.63, 329.63, 392.00, 523.25],
                [220.00, 261.63, 329.63, 440.00],
                [246.94, 311.13, 369.99, 493.88],
                [174.61, 220.00, 261.63, 349.23]
            ];
            function ensureBgmGain() {
                const c = getCtx();
                if (!bgmGain) { bgmGain = c.createGain(); bgmGain.gain.value = muted ? 0 : 0.06; bgmGain.connect(c.destination); }
                return bgmGain;
            }
            function bgmNote(freq, start, dur, vol, type) {
                const c = getCtx();
                const g = ensureBgmGain();
                const osc = c.createOscillator();
                const ng = c.createGain();
                osc.type = type; osc.frequency.value = freq;
                osc.connect(ng).connect(g);
                ng.gain.setValueAtTime(0.0001, start);
                ng.gain.exponentialRampToValueAtTime(vol, start + 0.03);
                ng.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                osc.start(start); osc.stop(start + dur + 0.05);
            }
            function bgmTick() {
                const c = getCtx();
                const now = c.currentTime;
                const chord = bgmProgression[Math.floor(bgmStep / 4) % bgmProgression.length];
                const note = chord[bgmStep % chord.length];
                bgmNote(note, now, 0.42, 0.5, 'triangle');
                bgmStep++;
            }
            return {
                unlock() { getCtx(); },
                tap() { tone(1100, 0.05, 'sine', 0.15); },
                confirm() { tone(720, 0.09, 'triangle', 0.18); tone(1080, 0.12, 'triangle', 0.16, 0.09); },
                lock() { tone(300, 0.12, 'sawtooth', 0.12); },
                success() { tone(660, 0.1, 'triangle', 0.18); tone(880, 0.12, 'triangle', 0.18, 0.1); tone(1320, 0.22, 'triangle', 0.2, 0.2); },
                wrong() { tone(220, 0.14, 'sawtooth', 0.16); tone(160, 0.2, 'sawtooth', 0.14, 0.1); },
                bgmStart() {
                    getCtx();
                    if (bgmPlaying) return;
                    bgmPlaying = true;
                    ensureBgmGain();
                    bgmTick();
                    bgmTimer = setInterval(bgmTick, 380);
                },
                bgmStop() {
                    bgmPlaying = false;
                    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
                },
                isMuted() { return muted; },
                setMuted(m) {
                    muted = m;
                    if (bgmGain) {
                        const c = getCtx();
                        bgmGain.gain.setTargetAtTime(muted ? 0 : 0.06, c.currentTime, 0.15);
                    }
                }
            };
        })();

        window.toggleMute = function() {
            const btn = document.getElementById('btn-mute');
            const nowMuted = !AudioFX.isMuted();
            AudioFX.setMuted(nowMuted);
            if (btn) {
                btn.textContent = nowMuted ? '🔇' : '🔊';
                btn.classList.toggle('is-muted', nowMuted);
            }
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBuzlysXVcL_KmmgWWbrTcJvwMGUfLBJhU",
            authDomain: "iamnrt-challenge.firebaseapp.com",
            databaseURL: "https://iamnrt-challenge-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "iamnrt-challenge",
            storageBucket: "iamnrt-challenge.firebasestorage.app",
            messagingSenderId: "25350114059",
            appId: "1:25350114059:web:a44040fd119858cfe0b00e",
            measurementId: "G-0558GH4DJL"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let pName = "", tName = "", hasAnswered = false, lastAnswer = null;
        const VALUE_LABELS = { I: 'I - สัตย์ซื่อ', A: 'A - คล่องตัว', M: 'M - มืออาชีพ', N: 'N - ไม่หยุดนิ่ง', R: 'R - วางใจได้', T: 'T - ร่วมมือ' };

        window.joinGame = function() {
            window.AudioFX && AudioFX.unlock();
            pName = document.getElementById('playerName').value.trim();
            tName = document.getElementById('teamName').value;
            if(!pName) return alert('กรุณาใส่ชื่อครับ');
            AudioFX.confirm();
            AudioFX.bgmStart();

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('mobile-controller').style.display = 'flex';
            document.getElementById('player-info').innerText = `📱 ${pName} (${tName})`;

            // 🟢 จุดที่เพิ่มเข้ามา: สั่งให้มือถือรายงานตัวเข้าฐานข้อมูลทันทีที่กดเข้าห้อง
            set(ref(db, `players/${pName}`), { name: pName, team: tName });

            onValue(ref(db, 'gameState'), (snapshot) => {
                const state = snapshot.val() || { phase: 'lobby' };
                const hint = document.getElementById('controller-hint');
                const revealEl = document.getElementById('reveal-overlay');
                if(state.phase === 'question') {
                    hasAnswered = false;
                    lastAnswer = null;
                    revealEl.classList.remove('active');
                    if (state.order && Array.isArray(state.order)) {
                        const grid = document.querySelector('.grid-buttons');
                        state.order.forEach(letter => {
                            const btn = document.getElementById('btn-' + letter);
                            if (btn) grid.appendChild(btn);
                        });
                    }
                    document.querySelectorAll('.btn-choice').forEach(b => b.disabled = false);
                    document.getElementById('lock-overlay').classList.remove('active');
                    if (hint) hint.innerText = 'เลือกคำตอบของคุณ!';
                } else if (state.phase === 'result') {
                    document.querySelectorAll('.btn-choice').forEach(b => b.disabled = true);
                    document.getElementById('lock-overlay').classList.remove('active');
                    showReveal(state.correctAnswer);
                } else {
                    document.querySelectorAll('.btn-choice').forEach(b => b.disabled = true);
                    document.getElementById('lock-overlay').classList.add('active');
                    revealEl.classList.remove('active');
                    const lockText = document.getElementById('lock-overlay').lastElementChild;
                    if(state.phase === 'lobby') { lockText.innerText = "รอเริ่มเกม... ⏳"; if (hint) hint.innerText = 'รอคำถามจากจอทีวี...'; }
                }
            });
        };



        function mobileCelebrate() {
            const host = document.getElementById('mobile-controller');
            const layer = document.createElement('div');
            layer.className = 'mobile-celebrate';
            const chars = ['✨','⭐','🎉','💫','🎊'];
            for (let i=0;i<22;i++) {
                const s = document.createElement('span');
                s.className = 'mobile-star';
                s.textContent = chars[i % chars.length];
                const a = (Math.PI*2*i/22) + Math.random()*.3;
                const d = 90 + Math.random()*190;
                s.style.setProperty('--dx', Math.cos(a)*d + 'px');
                s.style.setProperty('--dy', Math.sin(a)*d + 'px');
                s.style.setProperty('--rot', (Math.random()*360-180) + 'deg');
                s.style.setProperty('--size', (16 + Math.random()*18) + 'px');
                s.style.animationDelay = (Math.random()*.12) + 's';
                layer.appendChild(s);
            }
            host.appendChild(layer);
            setTimeout(() => layer.remove(), 1200);
        }

        function showReveal(correctAnswer) {
            const revealEl = document.getElementById('reveal-overlay');
            const icon = document.getElementById('reveal-icon');
            const status = document.getElementById('reveal-status');
            const answerText = document.getElementById('reveal-answer-text');
            answerText.innerText = VALUE_LABELS[correctAnswer] || correctAnswer || '-';

            revealEl.classList.remove('is-correct', 'is-wrong', 'is-none');
            if (lastAnswer === null) {
                revealEl.classList.add('is-none');
                icon.textContent = '😅';
                status.textContent = 'หมดเวลา! ไม่ได้ตอบ';
                AudioFX.wrong();
            } else if (lastAnswer === correctAnswer) {
                revealEl.classList.add('is-correct');
                icon.textContent = '🎉';
                status.textContent = 'ถูกต้อง!';
                AudioFX.success();
                setTimeout(mobileCelebrate, 80);
            } else {
                revealEl.classList.add('is-wrong');
                icon.textContent = '😢';
                status.textContent = 'ยังไม่ถูกต้อง';
                AudioFX.wrong();
            }
            revealEl.classList.add('active');
        }

        window.submitAnswer = function(ans) {
            if(hasAnswered) return;
            hasAnswered = true;
            lastAnswer = ans;
            AudioFX.tap();
            document.querySelectorAll('.btn-choice').forEach(b => b.disabled = true);
            document.getElementById('lock-overlay').classList.add('active');
            document.getElementById('lock-overlay').lastElementChild.innerText = "ส่งคำตอบแล้ว! รอดูผล 🚀";
            setTimeout(() => AudioFX.success(), 80);

            set(ref(db, `answers/${pName}`), { name: pName, team: tName, answer: ans, time: Date.now() });
        };
    </script>
</body>
</html>
