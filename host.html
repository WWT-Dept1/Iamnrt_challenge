<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAMNRT: The Core Value Challenge (TV Host)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #241143; --ink-soft: #5B4B7A;
            --paper: #FFFFFF; --cream: #FFF6E9;
            --card-bg: rgba(255,255,255,0.96);
            --card-border: rgba(36,17,67,0.10);

            --bg-1: #FF3D74; --bg-2: #FF8A3D; --bg-3: #7B3FFF; --bg-4: #FFD23D;

            --gold: #FFC400; --silver: #B9C4D6; --bronze: #FF8C1A;
            --color-i: #FF3D5A; --color-a: #FF8C1A; --color-m: #FFC400;
            --color-n: #2ECC71; --color-r: #21C1E0; --color-t: #7B3FFF;
            --team-1: #FF8C1A; --team-2: #21C1E0; --team-3: #7B3FFF; --team-4: #2ECC71; --team-5: #FF3D74;
            --coral: #FF3D74; --cyan: #21C1E0; --violet: #7B3FFF; --lime: #2ECC71;

            --font-display: 'Kanit', sans-serif;
            --font-body: 'Prompt', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }
        body {
            background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-4), var(--bg-3), var(--bg-1));
            background-size: 400% 400%;
            animation: bgShift 9s ease infinite;
            color: var(--ink); display: flex; flex-direction: column;
            height: 100vh; overflow: hidden; align-items: center; justify-content: center;
            position: relative;
        }
        @keyframes bgShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

        /* Big soft blob decorations for depth without darkening anything */
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.45; z-index: 0; animation: floatOrb 9s ease-in-out infinite; background: #fff; }
        .orb-1 { width: 340px; height: 340px; top: -110px; left: -100px; }
        .orb-2 { width: 280px; height: 280px; bottom: -80px; right: -80px; animation-delay: 2s; }
        .orb-3 { width: 220px; height: 220px; top: 42%; right: 6%; animation-delay: 4s; opacity: 0.3; }
        @keyframes floatOrb { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-28px) scale(1.08);} }

        /* Confetti dot texture drifting behind everything */
        .sparkle-bg { position: fixed; inset: -10%; z-index: 0; pointer-events: none; opacity: 0.5;
            background-image: radial-gradient(circle, rgba(255,255,255,0.55) 2px, transparent 2.5px);
            background-size: 46px 46px;
            animation: sparkleDrift 22s linear infinite;
        }
        @keyframes sparkleDrift { from { background-position: 0 0; } to { background-position: 400px 400px; } }

        /* ---------- Carnival bunting strip: triangle pennant flags + twinkling bulbs (no sliding motion) ---------- */
        .marquee-lights {
            height: 22px; width: 100%;
            position: relative;
            background-image: repeating-linear-gradient(
                135deg,
                var(--coral) 0 14px, var(--gold) 14px 28px,
                var(--cyan) 28px 42px, var(--violet) 42px 56px, var(--lime) 56px 70px
            );
            clip-path: polygon(
                0% 0%, 3.5% 0%, 0% 100%, 7% 0%, 10.5% 0%, 7% 100%, 14% 0%, 17.5% 0%, 14% 100%,
                21% 0%, 24.5% 0%, 21% 100%, 28% 0%, 31.5% 0%, 28% 100%, 35% 0%, 38.5% 0%, 35% 100%,
                42% 0%, 45.5% 0%, 42% 100%, 49% 0%, 52.5% 0%, 49% 100%, 56% 0%, 59.5% 0%, 56% 100%,
                63% 0%, 66.5% 0%, 63% 100%, 70% 0%, 73.5% 0%, 70% 100%, 77% 0%, 80.5% 0%, 77% 100%,
                84% 0%, 87.5% 0%, 84% 100%, 91% 0%, 94.5% 0%, 91% 100%, 98% 0%, 100% 0%, 98% 100%
            );
            filter: drop-shadow(0 3px 4px rgba(36,17,67,0.35));
        }
        .marquee-lights::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 6px;
            background-image: radial-gradient(circle, #fff 0 2.5px, transparent 3px);
            background-size: 24px 6px;
            animation: bulbTwinkle 1.6s ease-in-out infinite;
        }
        @keyframes bulbTwinkle { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .tv-header { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: column; z-index: 10; }
        .tv-header-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px 8px; }
        .header-brand { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: 0.5px; color: var(--ink); background: var(--card-bg); border: 2px solid var(--gold); padding: 9px 22px; border-radius: 30px; backdrop-filter: blur(6px); box-shadow: 0 8px 20px rgba(36,17,67,0.2); animation: chipFloat 3.4s ease-in-out infinite; }
        .player-count { font-size: 16px; color: var(--ink); font-weight: 700; transition: color 0.3s; background: var(--card-bg); padding: 9px 22px; border-radius: 30px; border: 2px solid rgba(36,17,67,0.12); backdrop-filter: blur(6px); box-shadow: 0 8px 20px rgba(36,17,67,0.2); animation: chipFloat 3.4s ease-in-out infinite 0.3s; }
        @keyframes chipFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .view { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; position: relative; z-index: 1; }
        .view.active { display: flex; animation: viewEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes viewEnter { 0%{opacity:0; transform: translateY(25px) scale(0.98);} 100%{opacity:1; transform: translateY(0) scale(1);} }

        .waiting-pulse { font-size: 22px; color: var(--ink); font-weight: 700; animation: chipFloat 3.2s ease-in-out infinite, pulseFade 1.6s ease-in-out infinite; background: var(--card-bg); border: 2px solid var(--cyan); padding: 15px 34px; border-radius: 26px; box-shadow: 0 10px 24px rgba(36,17,67,0.22); }
        @keyframes pulseFade { 0%,100%{opacity:0.75;} 50%{opacity:1;} }

        /* ===== LOBBY ===== */
        .title-logo { font-family: var(--font-display); font-size: 100px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; animation: floatLogo 3s ease-in-out infinite, logoGlow 2.4s ease-in-out infinite; color: #fff; -webkit-text-stroke: 3px var(--ink); text-shadow: 6px 6px 0 rgba(36,17,67,0.25); }
        .title-logo span { color: var(--gold); -webkit-text-stroke: 3px var(--ink); }
        @keyframes floatLogo { 0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-14px) rotate(1deg);} }
        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
            50% { filter: drop-shadow(0 0 26px rgba(255,255,255,0.75)); }
        }
        .subtitle { font-size: 21px; color: var(--ink); margin-bottom: 25px; font-weight: 700; background: var(--card-bg); border: 2px solid var(--coral); padding: 12px 30px; border-radius: 40px; backdrop-filter: blur(6px); display: inline-block; box-shadow: 0 10px 26px rgba(36,17,67,0.22); animation: chipFloat 3.6s ease-in-out infinite 0.15s; }
        .start-btn {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, var(--coral), var(--violet));
            background-size: 200% 200%;
            animation: shimmerBtn 3s ease infinite, ctaGlowPulse 1.8s ease-in-out infinite;
            color: #fff; border: 3px solid var(--ink);
            padding: 18px 60px; font-size: 28px; font-weight: 700; border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 0 var(--ink), 0 18px 34px rgba(36,17,67,0.3); margin-top: 25px; font-family: var(--font-display);
            transition: transform 0.12s, box-shadow 0.12s;
        }
        @keyframes ctaGlowPulse {
            0%, 100% { box-shadow: 0 8px 0 var(--ink), 0 18px 34px rgba(36,17,67,0.3), 0 0 0 0 rgba(255,196,0,0.5); }
            50% { box-shadow: 0 8px 0 var(--ink), 0 18px 34px rgba(36,17,67,0.3), 0 0 0 12px rgba(255,196,0,0); }
        }
        .start-btn::after {
            content: ""; position: absolute; top: 0; left: -40%; width: 30%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-20deg);
            animation: btnShine 3.4s ease-in-out infinite;
        }
        @keyframes shimmerBtn { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .start-btn:hover { transform: translateY(-2px) scale(1.03); }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink), 0 6px 14px rgba(36,17,67,0.3); }

        .lobby-teams { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 1250px; margin-top: 10px; }
        .lobby-team-col { background: var(--card-bg); border-radius: 18px; padding: 16px; width: 210px; min-height: 200px; border: 3px solid; backdrop-filter: blur(4px); box-shadow: 0 10px 24px rgba(36,17,67,0.18); }
        .lobby-team-col.t1 { border-color: var(--team-1); } .lobby-team-col.t2 { border-color: var(--team-2); }
        .lobby-team-col.t3 { border-color: var(--team-3); } .lobby-team-col.t4 { border-color: var(--team-4); } .lobby-team-col.t5 { border-color: var(--team-5); }
        .lobby-team-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: var(--ink); }
        .lobby-team-count { background: rgba(36,17,67,0.08); padding: 2px 10px; border-radius: 20px; font-size: 14px; color: var(--ink); }
        .lobby-chip-list { display: flex; flex-direction: column; gap: 6px; }
        .player-chip { background: rgba(36,17,67,0.06); color: var(--ink); padding: 7px 12px; border-radius: 10px; font-size: 15px; font-weight: 600; animation: popIn 0.4s ease-out backwards; }
        .chip-empty { font-size: 13px; color: var(--ink-soft); font-style: italic; }
        @keyframes popIn { 0%{transform:scale(0.3); opacity:0;} 70%{transform:scale(1.08);} 100%{transform:scale(1); opacity:1;} }

        /* ===== GET READY ===== */
        .get-ready-card { background: var(--card-bg); border: 3px solid var(--gold); border-radius: 32px; padding: 45px 70px; backdrop-filter: blur(8px); box-shadow: 0 18px 44px rgba(36,17,67,0.25); }
        .get-ready-num { font-family: var(--font-display); font-weight: 800; font-size: 108px; color: var(--coral); animation: zoomPunch 0.65s cubic-bezier(0.34,1.56,0.64,1); }
        .get-ready-sub { font-size: 24px; color: var(--ink); margin-top: 10px; font-weight: 700; animation: fadeSlideUp 0.5s ease-out 0.25s backwards; }
        @keyframes zoomPunch { 0%{transform:scale(0.2) rotate(-8deg); opacity:0;} 60%{transform:scale(1.25) rotate(3deg); opacity:1;} 100%{transform:scale(1) rotate(0);} }
        @keyframes fadeSlideUp { 0%{transform:translateY(14px); opacity:0;} 100%{transform:translateY(0); opacity:1;} }

        /* ===== QUESTION — big bright stage ===== */
        .q-progress-badge { font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--ink); background: var(--gold); padding: 7px 24px; border-radius: 20px; margin-bottom: 14px; box-shadow: 0 6px 16px rgba(36,17,67,0.25); border: 2px solid var(--ink); }
        .question-stage { position: relative; width: 90%; max-width: 980px; margin-bottom: 16px; }
        .question-image-container { position: relative; z-index: 1; width: 100%; height: 480px; border-radius: 30px; overflow: hidden; border: 6px solid #fff; box-shadow: 0 24px 60px rgba(36,17,67,0.35), 0 0 0 4px var(--cyan), 0 0 40px rgba(33,193,224,0.5); animation: stageGlow 2.4s ease-in-out infinite; }
        @keyframes stageGlow {
            0%, 100% { box-shadow: 0 24px 60px rgba(36,17,67,0.35), 0 0 0 4px var(--cyan), 0 0 30px rgba(33,193,224,0.4); }
            50% { box-shadow: 0 24px 60px rgba(36,17,67,0.35), 0 0 0 4px var(--cyan), 0 0 55px rgba(33,193,224,0.75); }
        }
        .question-image { width: 100%; height: 100%; object-fit: cover; }
        .question-text { position: relative; z-index: 1; font-size: 34px; font-weight: 600; max-width: 960px; margin-bottom: 16px; background: var(--card-bg); color: var(--ink); border: 2px solid var(--card-border); border-radius: 22px; padding: 20px 36px; backdrop-filter: blur(6px); box-shadow: 0 10px 28px rgba(36,17,67,0.2); line-height: 1.35; }

        /* Countdown clock — bright white face, crisp colored ring, no more muddy dark */
        .countdown-clock {
            position: absolute; top: -30px; right: -30px; width: 150px; height: 150px; border-radius: 50%; z-index: 2;
            background: conic-gradient(var(--clock-color, var(--lime)) var(--pct, 100%), rgba(36,17,67,0.14) 0);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 14px 34px rgba(36,17,67,0.35), 0 0 0 6px #fff;
            transition: box-shadow 0.2s;
        }
        .countdown-clock::before {
            content: ""; position: absolute; inset: 11px; border-radius: 50%;
            background: #fff; box-shadow: inset 0 3px 8px rgba(36,17,67,0.12);
        }
        .countdown-number { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 800; font-size: 58px; color: var(--ink); }
        .countdown-clock { animation: clockTick 1s ease-in-out infinite; }
        @keyframes clockTick { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .countdown-clock.low-time { animation: clockPulse 0.5s ease-in-out infinite; }
        @keyframes clockPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
        .answered-count { position: relative; z-index: 1; margin-top: 16px; font-size: 17px; color: var(--ink); font-weight: 700; background: var(--card-bg); border: 2px solid var(--violet); padding: 9px 24px; border-radius: 24px; backdrop-filter: blur(6px); box-shadow: 0 8px 20px rgba(36,17,67,0.2); }

        /* ===== RESULT (correct answer reveal) ===== */
        .result-headline { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; padding: 40px 0; }
        .result-text { position: relative; z-index: 2; font-size: 56px; font-weight: 800; margin: 0; font-family: var(--font-display); background: var(--card-bg); color: var(--ink); border: 3px solid var(--gold); padding: 18px 48px; border-radius: 26px; backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(36,17,67,0.25); }
        .result-glow {
            position: absolute; width: 440px; height: 440px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.6), rgba(255,196,0,0.25) 45%, transparent 70%);
            filter: blur(10px); z-index: 0;
            animation: glowPulse 1.8s ease-in-out infinite;
        }
        @keyframes glowPulse { 0%,100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } }
        .result-badge-spin {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            z-index: 1; animation: badgeSpin 14s linear infinite;
        }
        @keyframes badgeSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        /* Confetti-ring medallion (replaces the old pointed star badge) — two rings of dots
           counter-spinning at different speeds for a lively kaleidoscope feel. */
        .result-badge {
            position: relative; width: 300px; height: 300px;
            animation: badgePop 0.6s cubic-bezier(0.34,1.56,0.64,1) backwards;
        }
        .result-badge::before, .result-badge::after {
            content: ""; position: absolute; top: 50%; left: 50%; border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .result-badge::before {
            width: 22px; height: 22px;
            box-shadow:
                0 -140px 0 0 var(--coral), 99px -99px 0 0 var(--gold),
                140px 0 0 0 var(--cyan), 99px 99px 0 0 var(--violet),
                0 140px 0 0 var(--lime), -99px 99px 0 0 var(--coral),
                -140px 0 0 0 var(--gold), -99px -99px 0 0 var(--cyan);
            opacity: 0.92;
        }
        .result-badge::after {
            width: 13px; height: 13px;
            box-shadow:
                0 -95px 0 0 var(--gold), 67px -67px 0 0 var(--violet),
                95px 0 0 0 var(--lime), 67px 67px 0 0 var(--coral),
                0 95px 0 0 var(--cyan), -67px 67px 0 0 var(--gold),
                -95px 0 0 0 var(--violet), -67px -67px 0 0 var(--lime);
            opacity: 0.85;
            animation: badgeSpinReverse 8s linear infinite;
        }
        @keyframes badgeSpinReverse { from { transform: translate(-50%, -50%) rotate(360deg); } to { transform: translate(-50%, -50%) rotate(0deg); } }
        @keyframes badgePop { 0% { transform: scale(0) rotate(-25deg); opacity: 0; } 70% { transform: scale(1.15) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }

        /* ===== ROUND REVEAL (per-question score popup) ===== */
        .reveal-card {
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
            width: 680px; max-width: 92%;
            padding: 46px 48px 42px;
            background: var(--card-bg);
            border: 3px solid var(--violet);
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(36,17,67,0.3);
            backdrop-filter: blur(10px);
            animation: cardPopIn 0.55s cubic-bezier(0.34,1.56,0.64,1) backwards;
        }
        .reveal-card::before {
            content: ""; position: absolute; width: 340px; height: 340px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,196,0,0.22), transparent 70%);
            bottom: -140px; right: -100px; filter: blur(10px); z-index: 0;
        }
        @keyframes cardPopIn { 0% { opacity: 0; transform: scale(0.82) translateY(24px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        .reveal-title { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 700; font-size: 34px; color: var(--coral); margin-bottom: 22px; }
        .reveal-list { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .reveal-row {
            display: flex; align-items: center; gap: 16px; justify-content: flex-start; background: rgba(36,17,67,0.05);
            color: var(--ink);
            border: 2px solid rgba(36,17,67,0.1); border-radius: 16px; padding: 12px 22px; font-size: 19px;
            animation: slideInReveal 0.5s ease-out backwards;
            transition: transform 0.15s;
        }
        .reveal-row:nth-child(1) { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,196,0,0.25); background: rgba(255,196,0,0.12); transform: scale(1.03); }
        .reveal-row:nth-child(2) { border-color: var(--silver); background: rgba(185,196,214,0.18); }
        .reveal-row:nth-child(3) { border-color: var(--bronze); background: rgba(255,140,26,0.12); }
        @keyframes slideInReveal { 0%{transform:translateX(-60px); opacity:0;} 100%{transform:translateX(0); opacity:1;} }
        .reveal-rank {
            flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; font-size: 19px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(36,17,67,0.08);
            border: 2px solid rgba(36,17,67,0.14);
        }
        .reveal-row:nth-child(1) .reveal-rank { background: #FFEEA8; border-color: var(--gold); }
        .reveal-row:nth-child(2) .reveal-rank { background: #EAEFF6; border-color: var(--silver); }
        .reveal-row:nth-child(3) .reveal-rank { background: #FFD9AE; border-color: var(--bronze); }
        .reveal-name { flex: 1; text-align: left; font-weight: 700; }
        .reveal-name small { color: var(--ink-soft); }
        .reveal-points { font-family: var(--font-display); font-weight: 700; color: #1BA860; font-size: 22px; }
        .reveal-empty {
            position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
            font-size: 21px; color: var(--ink); font-weight: 700; text-align: center;
            padding: 22px 26px; border-radius: 20px; width: 100%;
            background: rgba(123,63,255,0.08);
            border: 2px solid rgba(123,63,255,0.25);
            backdrop-filter: blur(12px);
            animation: emptyBounce 2.4s ease-in-out infinite;
        }
        @keyframes emptyBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .next-btn {
            position: relative; z-index: 1; overflow: hidden;
            margin-top: 32px;
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            background-size: 200% 200%;
            animation: shimmerBtn 3s ease infinite;
            color: #fff; border: 3px solid var(--ink); padding: 16px 46px; font-size: 22px; font-weight: 700;
            border-radius: 50px; cursor: pointer; font-family: var(--font-display);
            box-shadow: 0 6px 0 var(--ink), 0 14px 26px rgba(36,17,67,0.28);
            opacity: 0; transform: translateY(10px) scale(0.95); pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .next-btn::after {
            content: ""; position: absolute; top: 0; left: -40%; width: 35%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-20deg);
            animation: btnShine 3.2s ease-in-out infinite;
        }
        @keyframes btnShine { 0% { left: -40%; } 60% { left: 130%; } 100% { left: 130%; } }
        .next-btn.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; animation: shimmerBtn 3s ease infinite, nextGlowPulse 1.8s ease-in-out infinite; }
        @keyframes nextGlowPulse {
            0%, 100% { box-shadow: 0 6px 0 var(--ink), 0 14px 26px rgba(36,17,67,0.28), 0 0 0 0 rgba(33,193,224,0.5); }
            50% { box-shadow: 0 6px 0 var(--ink), 0 14px 26px rgba(36,17,67,0.28), 0 0 0 10px rgba(33,193,224,0); }
        }
        .next-btn:hover { transform: translateY(-2px) scale(1.03); }
        .next-btn:active { transform: translateY(4px) scale(0.97); box-shadow: 0 2px 0 var(--ink), 0 6px 14px rgba(36,17,67,0.28); }

        /* ===== LEADERBOARD / TEAM BREAKDOWN ===== */

        @keyframes championGlow {

        .finale-rank { font-family: var(--font-display); font-weight: 700; font-size: 28px; }
        .finale-team { font-size: 19px; font-weight: 700; text-align: center; }

        /* Podium ordering: rank 1 appended first, center it and lift it above 2nd/3rd */

    <script>
        // ---------- Lightweight synthesized sound effects (no external audio files) ----------
        const AudioFX = (function() {
            let ctx;
            function getCtx() {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                return ctx;
            }
            function tone(freq, duration, type, vol, delay) {
                delay = delay || 0;
                const c = getCtx();
                const osc = c.createOscillator();
                const gain = c.createGain();
                osc.type = type; osc.frequency.value = freq;
                osc.connect(gain).connect(c.destination);
                const start = c.currentTime + delay;
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(vol, start + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.start(start); osc.stop(start + duration + 0.02);
            }
            return {
                unlock() { getCtx(); },
                click() { tone(1000, 0.05, 'sine', 0.14); },
                whoosh() { tone(200, 0.18, 'sine', 0.1); tone(500, 0.18, 'sine', 0.08, 0.05); },
                tick() { tone(880, 0.07, 'square', 0.1); },
                tickUrgent() { tone(600, 0.09, 'square', 0.18); },
                buzzer() { tone(150, 0.5, 'sawtooth', 0.22); tone(100, 0.6, 'sawtooth', 0.18, 0.05); },
                reveal() { tone(659, 0.12, 'triangle', 0.2); tone(880, 0.14, 'triangle', 0.2, 0.12); tone(1318, 0.28, 'triangle', 0.22, 0.24); },
                fanfare() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.28, 'triangle', 0.2, i * 0.14)); },
                coin() { tone(988, 0.08, 'square', 0.13); tone(1318, 0.1, 'square', 0.13, 0.06); }
            };
        })();

        // Confetti helper (used by inline module below via window scope)
        window.createConfetti = function() {
            const colors = ['#FF3D74', '#FFC400', '#21C1E0', '#7B3FFF', '#2ECC71', '#FF8C1A'];
            for (let i = 0; i < 50; i++) {
                let c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                c.style.setProperty('--sway', (Math.random() * 200 - 100) + 'px');
                c.style.setProperty('--spin', (Math.random() * 540 + 420) + 'deg');
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                c.style.animationDuration = (Math.random() * 2 + 2.2) + 's';
                c.style.animationTimingFunction = 'cubic-bezier(0.45, 0, 0.55, 1)';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 4400);
            }
        };

            { img: "https://wwt-dept1.github.io/Iamnrt_challenge/q6.JPEG.jpeg", text: "พนักงานกะ C ช่วยกันจัดการเหตุการสารเคมี Sodium Sulfide ล้น ทุกคนช่วยกันโดยไม่แบ่งว่าไม่ใช่หน้าที่ของตนเอง", answer: "T" },

            { img: "https://wwt-dept1.github.io/Iamnrt_challenge/q8.JPEG.jpeg", text: "นายนฤดี ปรับตัวตามนโยบายเปลี่ยนให้บันทึกข้อมูลผ่าน ระบบอิเล็กทรอนิกส์ นายนฤดีเรียนรู้และใช้งานทันที", answer: "A" },

            { img: "", text: "10. สมัครเข้าอบรมระบบบำบัดน้ำเสียแบบชีวภาพขั้นสูงในช่วงวันหยุด", answer: "N" }
        ];

        // 🔗 URL ของ Google Apps Script Web App (ดู Code.gs ที่แนบมาด้วย)
        // นำ URL ที่ได้จากการ Deploy > New deployment > Web app มาใส่ตรงนี้
        const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzBwd4k4PkTXwc2l4kc2xPH-R4qR4KBjFWolLFqqOlZP1GsDH5NFztLzkxUosHSBpI/exec";

        let gameQuestions = [...masterQuestions];

        let allPlayers = {};
        let playerScores = {};
        let questionStartTime = 0;
        let lastTickSecond = null;
        let gameAnswerLog = [];   // เก็บคำตอบทุกข้อของทุกคนไว้ส่งขึ้นชีตตอนจบเกม
        let currentSessionId = "";

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function countUp(el, target, duration = 800, prefix = '', suffix = '') {
            const start = 0;
            const startTime = performance.now();
            function tick(now) {
                const progress = Math.min(1, (now - startTime) / duration);
                const eased = 1 - Math.pow(1 - progress, 3);
                const value = Math.round(start + (target - start) * eased);
                el.innerText = prefix + value.toLocaleString() + suffix;
                if (progress < 1) requestAnimationFrame(tick);
                else el.innerText = prefix + target.toLocaleString() + suffix;
            }
            requestAnimationFrame(tick);
        }

        onValue(ref(db, 'players'), (snapshot) => {
            allPlayers = snapshot.val() || {};

                if (count > 0) {
                    display.innerText = `👥 ผู้เล่นพร้อมแล้ว: ${count} คน`;

            const container = document.getElementById('lobby-teams');

                const chips = members.map(([id, p], ci) => `<div class="player-chip" style="animation-delay:${ci * 0.05}s">🙋 ${p.name}</div>`).join('');

        function showGetReady() {
            switchView('view-get-ready');

            document.getElementById('get-ready-num').innerText = `ข้อที่ ${currentQIndex + 1} / ${gameQuestions.length}`;

        function startQuestion() {
            const order = shuffleArray(['I', 'A', 'M', 'N', 'R', 'T']);
            set(ref(db, 'answers'), null);
            set(ref(db, 'gameState'), { phase: 'question', qIndex: currentQIndex, order: order });

            const q = gameQuestions[currentQIndex];
            const qImageContainer = document.querySelector('.question-image-container');
            if (q.img) {
                document.getElementById('q-image').src = q.img;
                qImageContainer.style.display = '';
            } else {
                document.getElementById('q-image').src = '';
                qImageContainer.style.display = 'none';
            }
            document.getElementById('q-text').innerText = q.text;
            document.getElementById('q-progress').innerText = `ข้อที่ ${currentQIndex + 1} / ${gameQuestions.length}`;
            document.getElementById('answered-count').innerText = `ตอบแล้ว 0/${Object.keys(allPlayers).length} คน`;

            const clockEl = document.getElementById('countdown-clock');
            const numberEl = document.getElementById('countdown-number');
            clockEl.style.setProperty('--pct', '100%');
            clockEl.style.setProperty('--clock-color', 'var(--lime)');
            clockEl.classList.remove('low-time');
            numberEl.innerText = '10';
            switchView('view-question');

            let timeLeft = 10000;
            questionStartTime = Date.now();
            lastTickSecond = 10;

            timerInterval = setInterval(() => {
                timeLeft -= 50;
                let percent = (timeLeft / 10000) * 100;
                clockEl.style.setProperty('--pct', `${percent}%`);
                const secondsLeft = Math.max(0, Math.ceil(timeLeft / 1000));
                numberEl.innerText = secondsLeft;

                if (secondsLeft !== lastTickSecond && secondsLeft > 0) {
                    lastTickSecond = secondsLeft;
                    if (secondsLeft <= 3) AudioFX.tickUrgent(); else AudioFX.tick();
                }

                if (percent < 30) { clockEl.style.setProperty('--clock-color', 'var(--color-i)'); clockEl.classList.add('low-time'); }
                else if (percent < 60) clockEl.style.setProperty('--clock-color', 'var(--color-m)');

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    AudioFX.buzzer();
                    calculateScores();
                }
            }, 50);
        }

        function calculateScores() {
            set(ref(db, 'gameState'), { phase: 'result' });
            const q = gameQuestions[currentQIndex];
            let roundScorers = [];

            for (let p in liveAnswers) {
                if (liveAnswers[p].answer === q.answer) {
                    const timeTaken = liveAnswers[p].time - questionStartTime;
                    const points = Math.max(100, Math.round(1000 - (timeTaken / 10)));

                    if (!playerScores[p]) {
                        playerScores[p] = { name: p, team: liveAnswers[p].team, score: 0 };
                    }
                    playerScores[p].score += points;
                    roundScorers.push({ name: p, team: liveAnswers[p].team, points: points });
                }
            }
            roundScorers.sort((a, b) => b.points - a.points);

            // 📝 บันทึกคำตอบของ "ทุกคน" ในข้อนี้ (ถูก/ผิด/ไม่ตอบ) ไว้ส่งขึ้น Google Sheet ตอนจบเกม
            for (let pName in allPlayers) {
                const ans = liveAnswers[pName];
                const isCorrect = !!ans && ans.answer === q.answer;
                const timeTakenMs = ans ? (ans.time - questionStartTime) : null;
                const points = isCorrect ? Math.max(100, Math.round(1000 - (timeTakenMs / 10))) : 0;
                gameAnswerLog.push({
                    qIndex: currentQIndex + 1,
                    question: q.text,
                    correctAnswer: q.answer,
                    name: pName,
                    team: allPlayers[pName].team,
                    answer: ans ? ans.answer : null,
                    correct: isCorrect,
                    points: points,
                    timeTakenMs: timeTakenMs
                });
            }

            showResult(q.answer, roundScorers);
        }

        function showResult(correctAnswer, roundScorers) {
            switchView('view-result');
            const map = { 'I': 'I - สัตย์ซื่อ', 'A': 'A - คล่องตัว', 'M': 'M - มืออาชีพ', 'N': 'N - ไม่หยุดนิ่ง', 'R': 'R - วางใจได้', 'T': 'T - ร่วมมือ' };
            document.getElementById('correct-answer-text').innerText = map[correctAnswer];
            document.getElementById('correct-answer-text').style.color = `var(--color-${correctAnswer.toLowerCase()})`;

            AudioFX.reveal();
            window.createConfetti();
            document.body.classList.add('anim-shake');
            setTimeout(() => document.body.classList.remove('anim-shake'), 300);

            setTimeout(() => {
                showRoundReveal(roundScorers);
            }, 2500);
        }

        function showRoundReveal(roundScorers) {
            switchView('view-round-reveal');
            const container = document.getElementById('round-reveal-list');
            container.innerHTML = '';
            const nextBtn = document.getElementById('btn-next-round');
            nextBtn.classList.remove('show');

            if (roundScorers.length === 0) {
                container.innerHTML = `<div class="reveal-empty">รอบนี้ไม่มีใครตอบถูกเลย! 😢</div>`;
            } else {
                roundScorers.forEach((s, idx) => {
                    const row = document.createElement('div');
                    row.className = 'reveal-row';
                    row.style.animationDelay = `${idx * 0.25}s`;
                    const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
                    row.innerHTML = `
                        <span class="reveal-rank">${medal}</span>
                        <span class="reveal-name">${s.name} <small>(${s.team})</small></span>
                        <span class="reveal-points" id="reveal-pts-${idx}">+0</span>
                    `;
                    container.appendChild(row);
                    setTimeout(() => {
                        countUp(document.getElementById(`reveal-pts-${idx}`), s.points, 700, '+');
                        AudioFX.coin();
                    }, idx * 250 + 200);
                });
                window.createConfetti();
            }

            const revealFinishDelay = roundScorers.length > 0 ? (roundScorers.length - 1) * 250 + 200 + 700 + 400 : 800;
            setTimeout(() => { nextBtn.classList.add('show'); }, revealFinishDelay);
        }

        window.continueFromRoundReveal = function () {
            AudioFX.click();
            document.getElementById('btn-next-round').classList.remove('show');
            currentQIndex++;
            if (currentQIndex >= gameQuestions.length) {
                set(ref(db, 'gameState'), { phase: 'lobby' });
                sendGameLogToSheet();
                showTop5();
            } else {
                showGetReady();
            }
        };

        // 📤 ส่งคะแนนสรุป + คำตอบละเอียดทุกข้อของรอบนี้ขึ้น Google Sheet
        function sendGameLogToSheet() {
            if (!SHEET_WEBAPP_URL || SHEET_WEBAPP_URL.indexOf('ใส่ID_ที่นี่') !== -1) {
                console.warn('ยังไม่ได้ตั้งค่า SHEET_WEBAPP_URL — ข้ามการบันทึกลง Google Sheet');
                return;
            }

            const rankedPlayers = Object.values(playerScores)
                .sort((a, b) => b.score - a.score)
                .map((p, idx) => ({ name: p.name, team: p.team, score: p.score, rank: idx + 1 }));

            const payload = {
                sessionId: currentSessionId,
                timestamp: new Date().toISOString(),
                players: rankedPlayers,
                answers: gameAnswerLog
            };

            // ใช้ text/plain + no-cors เพื่อเลี่ยงปัญหา CORS preflight กับ Apps Script Web App
            fetch(SHEET_WEBAPP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).catch(err => console.error('ส่งข้อมูลขึ้น Google Sheet ไม่สำเร็จ:', err));
        }

        let top5ConfettiInterval = null;

        function showTop5() {
            switchView('view-top5');
            const container = document.getElementById('top5-list');
            container.innerHTML = '';
            const nextBtn = document.getElementById('btn-next-top5');
            nextBtn.classList.remove('show');
            if (top5ConfettiInterval) { clearInterval(top5ConfettiInterval); top5ConfettiInterval = null; }

            // ค้างหน้านี้ไว้ 60 วินาที ก่อนให้ปุ่มไป Tournament Champion ปรากฏ
            setTimeout(() => { nextBtn.classList.add('show'); }, 60000);

            let sorted = Object.values(playerScores).sort((a, b) => b.score - a.score).slice(0, 5);
            if (sorted.length === 0) {
                container.innerHTML = `<div class="reveal-empty">ไม่มีข้อมูลคะแนนผู้เล่น</div>`;
                return;
            }

            let revealOrder = [...sorted].reverse();
            revealOrder.forEach((p, i) => {
                setTimeout(() => {
                    const rank = sorted.length - i;
                    const row = document.createElement('div');
                    row.className = `top5-row rank-${rank}`;
                    const medal = rank === 1 ? '👑' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
                    row.innerHTML = `
                        <span class="top5-rank">${medal}</span>
                        <span class="top5-name">${p.name}<br><small>${p.team}</small></span>
                        <span class="top5-score" id="top5-score-${rank}">0 pts</span>
                    `;
                    container.appendChild(row);
                    AudioFX.reveal();
                    setTimeout(() => {
                        countUp(document.getElementById(`top5-score-${rank}`), p.score, 900, '', ' pts');
                    }, 200);
                    if (rank === 1) {
                        AudioFX.fanfare();
                        window.createConfetti();
                        top5ConfettiInterval = setInterval(window.createConfetti, 1200);
                    } else {
                        window.createConfetti();
                    }
                }, i * 2200);
            });
        }

        window.continueFromTop5 = function () {
            AudioFX.click();
            document.getElementById('btn-next-top5').classList.remove('show');
            if (top5ConfettiInterval) { clearInterval(top5ConfettiInterval); top5ConfettiInterval = null; }
            showGrandFinale();
        };

        function showGrandFinale() {
            switchView('view-grand-finale');
            AudioFX.fanfare();

            let teamTotals = {};
            getActiveTeams().forEach(t => { teamTotals[t] = 0; });
            for (let pId in playerScores) {
                let t = playerScores[pId].team;
                if (teamTotals[t] !== undefined) {
                    teamTotals[t] += playerScores[pId].score;
                }
            }

            let sortedTeams = Object.keys(teamTotals).map(t => ({ name: t, score: teamTotals[t] }));
            sortedTeams.sort((a, b) => b.score - a.score);

            const teamOrder = getActiveTeams();
            const stripeColors = ['var(--team-1)', 'var(--team-2)', 'var(--team-3)', 'var(--team-4)', 'var(--team-5)'];

            const chart = document.getElementById('grand-chart');
            chart.innerHTML = '';

            const medal = (rank) => rank === 1 ? '👑' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;

            sortedTeams.forEach((t, index) => {
                const rank = index + 1;
                const card = document.createElement('div');
                card.className = `finale-card ${index === 0 ? 'is-champion' : ''}`;
                card.style.animationDelay = `${index * 0.12}s`;
                const colorIdx = teamOrder.indexOf(t.name);
                card.style.setProperty('--stripe-color', stripeColors[colorIdx >= 0 ? colorIdx % stripeColors.length : index % stripeColors.length]);

                const rankText = document.createElement('div');
                rankText.className = 'finale-rank';
                rankText.innerText = medal(rank);

                const nameText = document.createElement('div');
                nameText.className = 'finale-team';
                nameText.innerText = t.name;

                const scoreText = document.createElement('div');
                scoreText.className = 'finale-score';
                scoreText.innerText = '0 pts';

                card.appendChild(rankText);
                card.appendChild(nameText);
                card.appendChild(scoreText);
                chart.appendChild(card);

                setTimeout(() => {
                    countUp(scoreText, t.score, 900, '', ' pts');
                    if (index === 0) {
                        window.createConfetti();
                        setInterval(window.createConfetti, 1800);
                    }
                }, index * 150 + 300);
            });
        }
    </script>
</body>
</html>
